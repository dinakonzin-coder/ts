body{font-family:'Kantumruy Pro',sans-serif;background:#f1f5f9;margin:0}
.fade{animation:fd .2s}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,Component}=React;

/* ===== CONSTANTS ===== */
const KM=['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];
const UR=[18,17,16,15,14,13,12,11],UL=[21,22,23,24,25,26,27,28];
const LL=[31,32,33,34,35,36,37,38],LR=[48,47,46,45,44,43,42,41];
const G=(k,f)=>{try{const i=localStorage.getItem(k);return i?JSON.parse(i):f}catch(e){return f}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const M=(a)=>'$'+Number(a||0).toFixed(2);
const fD=(s)=>{if(!s)return'';const d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('km-KH',{year:'numeric',month:'short',day:'numeric'})};
const tI=()=>new Date().toISOString().split('T')[0];
const kmToIso=(s)=>{if(!s)return'';const p=s.split(' ');if(p.length<2)return'';const i=KM.indexOf(p[0]);return i<0?'':`${p[1]}-${String(i+1).padStart(2,'0')}`};

const INIT_CLINIC={name:"គ្លីនិកធ្មេញ ឡុង ហៃសេង",subtitle:"គុណភាព សុវត្ថិភាព និងអនាម័យ",phone:"012 659 871 / 087 567 439",address:"ទល់មុខផ្សារទ្រីភាព",footerNote:"សូមអរគុណ! សូមជូនពរសុខភាពល្អ!"};

const INIT_SERVICES=[
{id:"c1",name:"ប៉ះធ្មេញ (Filling)",price:50},{id:"c2",name:"ដកធ្មេញ (Extraction)",price:30},
{id:"c3",name:"លាងសម្អាត (Scaling)",price:30},{id:"c4",name:"ខាត់ធ្មេញឲ្យស (Whitening)",price:80},
{id:"c5",name:"ព្យាបាលឫសធ្មេញ (Root Canal)",price:120},{id:"c6",name:"ដាក់ក្បាលធ្មេញ (Crown)",price:250},
{id:"c7",name:"ពត់ធ្មេញ (Orthodontics)",price:1200},{id:"c8",name:"ដាំធ្មេញ (Implant)",price:800}];

const INIT_PATIENTS=[
{id:"P-1001",name:"សុក សុភា",phone:"012 345 678",gender:"ស្រី",age:28,
 services:[{id:"s1",name:"ប៉ះធ្មេញ (Filling)",teeth:[16,17],price:100},{id:"s2",name:"ដាក់ក្បាលធ្មេញ (Crown)",teeth:[26],price:250}],
 createdAt:tI(),notes:"ឈឺធ្មេញ ១៦",
 appointments:[{id:"a1",date:tI(),time:"09:00",note:"ពិនិត្យដំបូង",status:"រួចរាល់"},{id:"a2",date:"2026-10-15",time:"14:00",note:"ដាំ Crown",status:"កំពុងរង់ចាំ"}],
 payments:[{id:"p1",amount:150,date:tI(),note:"ប្រាក់កក់"}]},
{id:"P-1002",name:"ចាន់ វីរៈ",phone:"098 765 432",gender:"ប្រុស",age:34,
 services:[{id:"s3",name:"ពត់ធ្មេញ (Orthodontics)",teeth:[11,12,13,21,22,23],price:1200}],
 createdAt:"2026-09-25",notes:"កញ្ចប់ពត់ធ្មេញ",
 appointments:[{id:"a3",date:"2026-09-25",time:"10:30",note:"បំពាក់ឧបករណ៍",status:"រួចរាល់"},{id:"a4",date:tI(),time:"11:00",note:"សារ៉េដែក",status:"កំពុងរង់ចាំ"}],
 payments:[{id:"p2",amount:400,date:"2026-09-25",note:"កក់ដំបូង"},{id:"p3",amount:100,date:tI(),note:"បង់បន្ថែម"}]}];

/* ===== ICONS (inline SVG) ===== */
const I=({d,c="w-4 h-4"})=><svg className={c} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d={d}/></svg>;
const Ic={
 Users:()=><I d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>,
 Calendar:()=><I d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>,
 Activity:()=><I d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>,
 Bar:()=><I d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 012 2h2a2 2 0 012-2z"/>,
 Plus:()=><I d="M12 4v16m8-8H4"/>,
 Search:()=><I d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>,
 Trash:()=><I d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>,
 Edit:()=><I d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>,
 Dollar:()=><I d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8V6m0 12v-2m9-4a9 9 0 11-18 0 9 9 0 0118 0z"/>,
 Printer:()=><I d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2z"/>,
 ChevD:()=><I c="w-3.5 h-3.5" d="M19 9l-7 7-7-7"/>,
 Spark:()=><I c="w-5 h-5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
};

/* ===== TOOTH SELECTOR ===== */
function ToothSel({selected=[],onToggle}){
 const T=(t)=>{const s=selected.includes(t);return(
  <button type="button" key={t} onClick={()=>onToggle(t)}
   className={`w-7 h-7 rounded-lg text-xs font-bold flex items-center justify-center border cursor-pointer ${s?'bg-teal-600 text-white border-teal-700':'bg-white text-slate-700 border-slate-200'}`}>{t}</button>)};
 return(<div className="bg-slate-100 p-2 rounded-xl border border-slate-200 overflow-x-auto">
  <div className="min-w-max flex flex-col gap-1">
   <div className="flex items-center gap-1">
    <span className="text-[10px] font-bold text-teal-700 w-8 text-right">លើ:</span>
    <div className="flex gap-0.5">{UR.map(T)}</div>
    <div className="w-px h-5 bg-slate-300 mx-1"></div>
    <div className="flex gap-0.5">{UL.map(T)}</div>
   </div>
   <div className="flex items-center gap-1">
    <span className="text-[10px] font-bold text-teal-700 w-8 text-right">ក្រោម:</span>
    <div className="flex gap-0.5">{LR.map(T)}</div>
    <div className="w-px h-5 bg-slate-300 mx-1"></div>
    <div className="flex gap-0.5">{LL.map(T)}</div>
   </div>
  </div>
 </div>)}

/* ===== REPORTS VIEW ===== */
function ReportsView({patients,clinic}){
 const now=new Date(),cy=now.getFullYear(),cm=now.getMonth(),cd=now.toISOString().split('T')[0];
 const [type,setType]=useState('monthly');
 const [selD,setSelD]=useState(cd);
 const [selM,setSelM]=useState(`${KM[cm]} ${cy}`);
 const [open,setOpen]=useState(false);

 const opts=useMemo(()=>{const a=[];
  if(type==='monthly'){for(let y=cy-2;y<=cy+10;y++)for(let m=0;m<12;m++)a.push(`${KM[m]} ${y}`);}
  else{for(let i=0;i<60;i++){const d=new Date();d.setDate(now.getDate()-i);a.push(d.toISOString().split('T')[0]);}}
  return a;},[type,cy]);

 const key=type==='daily'?selD:kmToIso(selM);
 const inR=(ds)=>ds&&ds.startsWith(key);

 const pays=patients.flatMap(p=>(p.payments||[]).map(x=>({...x,pN:p.name,pP:p.phone}))).filter(x=>inR(x.date));
 const newPs=patients.filter(p=>inR(p.createdAt));
 const apps=patients.flatMap(p=>(p.appointments||[]).map(x=>({...x,pN:p.name,pP:p.phone}))).filter(x=>inR(x.date));
 const totRev=pays.reduce((s,x)=>s+x.amount,0);
 const done=apps.filter(x=>x.status==='រួចរាល់');
 const newBill=newPs.reduce((s,p)=>s+(p.services||[]).reduce((ss,sv)=>ss+sv.price,0),0);
 const avg=pays.length>0?totRev/pays.length:0;

 const title=type==='daily'?'របាយការណ៍បូកសរុបប្រចាំថ្ងៃ':'របាយការណ៍បូកសរុបប្រចាំខែ';
 const sub=type==='daily'?'តាមការចំណូល ចំនួនអ្នកជំងឺ និងការណាត់ជួបប្រចាំថ្ងៃ':'តាមការចំណូល ចំនួនអ្នកជំងឺ និងការណាត់ជួបប្រចាំខែ';
 const per=type==='daily'?`កាលបរិច្ឆេទ: ${selD}`:`ខែ: ${selM}`;
 const curVal=type==='daily'?selD:selM;

 const print=()=>{
  const w=window.open('','_blank','width=350,height=600');if(!w)return;
  w.document.write(`<html><head><title>POS</title><style>body{font-family:'Courier New',monospace;width:300px;margin:0 auto;padding:10px}.c{text-align:center}.b{font-weight:bold}.l{border-bottom:1px dashed #000;margin:8px 0}.f{display:flex;justify-content:space-between}.s{font-size:11px}</style></head><body>
  <div class="c b" style="font-size:14px">${clinic.name}</div><div class="c s">${clinic.subtitle}</div><div class="l"></div>
  <div class="c b">${title}</div><div class="c s">${per}</div><div class="l"></div>
  <div class="f"><span>ចំណូលសរុប:</span><span class="b">${M(totRev)}</span></div><div class="s">ប្រតិបត្តិការ: ${pays.length} លើក</div>
  <div class="f"><span>អ្នកជំងឺថ្មី:</span><span class="b">${newPs.length} នាក់</span></div><div class="s">ថ្លៃសេវា: ${M(newBill)}</div>
  <div class="f"><span>ណាត់ជួប:</span><span class="b">${apps.length} ដង</span></div><div class="s">រួចរាល់: ${done.length} ដង</div>
  <div class="f"><span>មធ្យមភាគ:</span><span class="b">${M(avg)}</span></div>
  <div class="l"></div><div class="c s">${clinic.footerNote}</div><div class="c s">${new Date().toLocaleString()}</div>
  </body></html>`);
  w.document.close();w.focus();setTimeout(()=>{w.print();w.close()},300);
 };

 return(<div className="space-y-3">
  <div className="bg-slate-200 p-1 rounded-xl flex no-print">
   <button onClick={()=>{setType('daily');setOpen(false)}} className={`flex-1 py-2.5 text-xs font-bold rounded-lg flex items-center justify-center gap-2 cursor-pointer ${type==='daily'?'bg-teal-700 text-white shadow':'text-slate-600'}`}><Ic.Calendar/> របាយការណ៍ប្រចាំថ្ងៃ</button>
   <button onClick={()=>{setType('monthly');setOpen(false)}} className={`flex-1 py-2.5 text-xs font-bold rounded-lg flex items-center justify-center gap-2 cursor-pointer ${type==='monthly'?'bg-teal-700 text-white shadow':'text-slate-600'}`}><Ic.Bar/> របាយការណ៍ប្រចាំខែ</button>
  </div>

  <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
   <div>
    <h2 className="text-base font-bold text-slate-800 flex items-center gap-2"><span className="text-teal-600"><Ic.Bar/></span>{title}</h2>
    <p className="text-[11px] text-slate-500 mt-0.5">{sub}</p>
   </div>
   <div className="flex items-center justify-between gap-2 flex-wrap">
    <div className="relative">
     <button onClick={()=>setOpen(!open)} className="flex items-center gap-2 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-[11px] font-medium text-slate-700 cursor-pointer">
      <span>{type==='daily'?`កាលបរិច្ឆេទ: ${selD}`:`ខែ: ${selM}`}</span>
      <span className={open?'rotate-180 transition':'transition'}><Ic.ChevD/></span>
     </button>
     {open&&<div className="absolute left-0 mt-2 w-52 max-h-56 overflow-y-auto bg-white border border-slate-200 rounded-xl shadow-xl z-50 p-1.5">
      <div className="text-[10px] text-slate-400 px-2 py-1 font-semibold sticky top-0 bg-white">{type==='daily'?'ជ្រើសថ្ងៃ':'ជ្រើសខែ'}</div>
      {opts.map(o=><button key={o} onClick={()=>{type==='daily'?setSelD(o):setSelM(o);setOpen(false)}} className={`w-full text-left px-2.5 py-1.5 text-[11px] rounded-lg cursor-pointer ${curVal===o?'bg-teal-700 text-white font-bold':'text-slate-700 hover:bg-slate-100'}`}>{o}</button>)}
     </div>}
    </div>
    <button onClick={print} className="flex items-center gap-1.5 px-3.5 py-2 bg-slate-900 text-white rounded-xl text-[11px] font-bold cursor-pointer"><Ic.Printer/> បោះពុម្ព POS</button>
   </div>
  </div>

  <div className="bg-emerald-600 text-white rounded-2xl p-5 shadow-sm space-y-1">
   <p className="text-xs font-medium text-emerald-100">ប្រាក់ចំណូលទទួលបានសរុប</p>
   <div className="text-3xl font-extrabold">{M(totRev)}</div>
   <div className="border-t border-emerald-500/50 pt-2 text-xs text-emerald-100 mt-2">ប្រតិបត្តិការបង់ប្រាក់: {pays.length} លើក</div>
  </div>

  <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-1">
   <p className="text-xs text-slate-500 font-medium">អ្នកជំងឺចុះឈ្មោះថ្មី</p>
   <div className="text-2xl font-bold text-slate-800">{newPs.length} នាក់</div>
   <p className="text-xs text-slate-400">ថ្លៃសេវាបម្រើការ: {M(newBill)}</p>
  </div>

  <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-1">
   <p className="text-xs text-slate-500 font-medium">ការណាត់ជួបក្នុង{type==='daily'?'ថ្ងៃ':'ខែ'}</p>
   <div className="text-2xl font-bold text-slate-800">{apps.length} ដង</div>
   <p className="text-xs text-slate-400">ព្យាបាលរួចរាល់: {done.length} ដង</p>
  </div>

  <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-1">
   <p className="text-xs text-slate-500 font-medium">មធ្យមភាគចំណូល/ប្រតិបត្តិការ</p>
   <div className="text-2xl font-bold text-slate-800">{M(avg)}</div>
  </div>

  <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-2">
   <div className="flex justify-between items-center border-b border-slate-100 pb-2">
    <h3 className="font-bold text-slate-800 text-xs">ប្រវត្តិប្រមូលប្រាក់ ({pays.length})</h3>
    <span className="text-xs font-bold text-emerald-700">{M(totRev)}</span>
   </div>
   {pays.length===0?<div className="text-center py-6 text-[11px] text-slate-400">មិនមានទិន្នន័យ</div>:
   <div className="space-y-1.5">{pays.map((x,i)=><div key={i} className="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex justify-between items-center">
    <div><p className="font-bold text-slate-800 text-[11px]">{x.pN}</p><p className="text-[10px] text-slate-500">{fD(x.date)} • {x.note||'បង់ប្រាក់'}</p></div>
    <span className="font-bold text-emerald-700 text-xs">{M(x.amount)}</span>
   </div>)}</div>}
  </div>
 </div>)}

/* ===== MAIN APP ===== */
function App(){
 const [clinic,setClinic]=useState(()=>G('c_info',INIT_CLINIC));
 const [services,setServices]=useState(()=>G('c_serv',INIT_SERVICES));
 const [patients,setPatients]=useState(()=>G('c_pat',INIT_PATIENTS));
 const [view,setView]=useState("patients"); /* DEFAULT = patients */
 const [search,setSearch]=useState("");
 const [selId,setSelId]=useState(null);
 const [tab,setTab]=useState("overview");
 const [filterDate,setFilterDate]=useState("");
 const [regOpen,setRegOpen]=useState(false);
 const [editPat,setEditPat]=useState(null);
 const [form,setForm]=useState({id:"",name:"",phone:"",gender:"ស្រី",age:"",services:[],deposit:"",firstAppDate:"",notes:""});
 const [payM,setPayM]=useState({open:false,patient:null,amount:"",note:""});
 const [appM,setAppM]=useState({open:false,patientId:"",date:tI(),time:"09:00",note:""});
 const [delM,setDelM]=useState({open:false,type:"",targetId:"",title:"",text:""});
 const [toast,setToast]=useState("");
 const [posM,setPosM]=useState(null);
 const [servM,setServM]=useState(false);
 const [servForm,setServForm]=useState({name:"",price:""});
 const [editServ,setEditServ]=useState(null);
 const [clinicM,setClinicM]=useState(false);

 useEffect(()=>S('c_info',clinic),[clinic]);
 useEffect(()=>S('c_serv',services),[services]);
 useEffect(()=>S('c_pat',patients),[patients]);

 const show=(m)=>{setToast(m);setTimeout(()=>setToast(""),2500)};

 const newPat=()=>{setEditPat(null);setForm({id:"",name:"",phone:"",gender:"ស្រី",age:"",services:[{id:`s${Date.now()}`,name:"",teeth:[],price:""}],deposit:"",firstAppDate:tI(),notes:""});setRegOpen(true)};
 const editPatOpen=(p)=>{setEditPat(p);setForm({id:p.id,name:p.name,phone:p.phone,gender:p.gender,age:p.age||"",services:p.services.length>0?p.services:[{id:`s${Date.now()}`,name:"",teeth:[],price:""}],deposit:"",firstAppDate:"",notes:p.notes||""});setRegOpen(true)};

 const savePat=(e)=>{e.preventDefault();
  if(!form.name||!form.phone){show("បញ្ចូលឈ្មោះ និងទូរស័ព្ទ!");return}
  const dep=parseFloat(form.deposit)||0;
  const fs=form.services.filter(s=>s.name.trim()!=="").map(s=>({id:s.id||`s${Date.now()}`,name:s.name,teeth:s.teeth||[],price:parseFloat(s.price)||0}));
  if(editPat){setPatients(patients.map(p=>p.id===editPat.id?{...p,name:form.name,phone:form.phone,gender:form.gender,age:parseInt(form.age)||0,services:fs,notes:form.notes}:p));show("បានកែប្រែ!")}
  else{const nid=`P-${Math.floor(1000+Math.random()*9000)}`;
   const np={id:nid,name:form.name,phone:form.phone,gender:form.gender,age:parseInt(form.age)||0,services:fs,createdAt:tI(),notes:form.notes,
    appointments:form.firstAppDate?[{id:`a${Date.now()}`,date:form.firstAppDate,time:"09:00",note:"ណាត់ជួបដំបូង",status:"កំពុងរង់ចាំ"}]:[],
    payments:dep>0?[{id:`p${Date.now()}`,amount:dep,date:tI(),note:"ប្រាក់កក់"}]:[]};
   setPatients([np,...patients]);setSelId(nid);show("បានចុះឈ្មោះ!")}
  setRegOpen(false)};

 const execDel=()=>{const {type,targetId}=delM;
  if(type==="PATIENT"){const r=patients.filter(p=>p.id!==targetId);setPatients(r);if(selId===targetId)setSelId(null);show("លុបអ្នកជំងឺ!")}
  else if(type==="SERVICE"){setServices(services.filter(s=>s.id!==targetId));show("លុបសេវា!")}
  else if(type==="PAYMENT"){setPatients(patients.map(p=>p.id===selId?{...p,payments:p.payments.filter(x=>x.id!==targetId)}:p));show("លុបទូទាត់!")}
  else if(type==="APPOINTMENT"){setPatients(patients.map(p=>p.id===selId?{...p,appointments:p.appointments.filter(x=>x.id!==targetId)}:p));show("លុបណាត់ជួប!")}
  setDelM({open:false,type:"",targetId:"",title:"",text:""})};

 const filtered=useMemo(()=>patients.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||p.phone.includes(search)||p.id.toLowerCase().includes(search.toLowerCase())),[patients,search]);

 const addPay=()=>{if(!payM.patient||!payM.amount)return;const a=parseFloat(payM.amount);if(a<=0)return;
  setPatients(patients.map(p=>p.id===payM.patient.id?{...p,payments:[...p.payments,{id:`p${Date.now()}`,amount:a,date:tI(),note:payM.note||"បង់បន្ថែម"}]}:p));
  setPayM({open:false,patient:null,amount:"",note:""});show("បានកត់ត្រា!")};

 const addApp=()=>{if(!appM.patientId)return;
  setPatients(patients.map(p=>p.id===appM.patientId?{...p,appointments:[...p.appointments,{id:`a${Date.now()}`,date:appM.date,time:appM.time,note:appM.note||"ណាត់ជួប",status:"កំពុងរង់ចាំ"}]}:p));
  setAppM({open:false,patientId:"",date:tI(),time:"09:00",note:""});show("បានបន្ថែម!")};

 const togApp=(pid,aid,st)=>{setPatients(patients.map(p=>p.id===pid?{...p,appointments:p.appointments.map(a=>a.id===aid?{...a,status:st}:a)}:p));show(`ប្តូរ: ${st}`)};

 const saveServ=(e)=>{e.preventDefault();if(!servForm.name||!servForm.price)return;
  if(editServ){setServices(services.map(s=>s.id===editServ.id?{...s,name:servForm.name,price:parseFloat(servForm.price)}:s));show("បានកែ!")}
  else{setServices([...services,{id:`c${Date.now()}`,name:servForm.name,price:parseFloat(servForm.price)}]);show("បានបន្ថែម!")}
  setServM(false);setServForm({name:"",price:""});setEditServ(null)};

 const NavBtn=({icon,label,val})=>(
  <button onClick={()=>setView(val)} className={`flex-1 flex flex-col items-center gap-1 py-1 cursor-pointer ${view===val?'text-white':'text-teal-200'}`}>
   {icon}
   <span className="text-[10px] font-medium text-center leading-tight">{label}</span>
   {view===val&&<div className="w-5 h-0.5 bg-white rounded-full mt-0.5"></div>}
  </button>);

 return(<div className="min-h-screen bg-slate-50 pb-20">
  {/* HEADER */}
  <header className="bg-teal-800 text-white shadow-md sticky top-0 z-30 no-print">
   <div className="max-w-md mx-auto px-4 pt-4">
    <div className="flex items-center justify-between">
     <div className="w-8"></div>
     <div className="text-center">
      <h1 className="font-bold text-base">{clinic.name}</h1>
      <p className="text-[10px] text-teal-200 mt-0.5">{clinic.subtitle}</p>
     </div>
     <button onClick={()=>setClinicM(true)} className="w-8 h-8 rounded-full hover:bg-teal-700 flex flex-col items-center justify-center gap-0.5 cursor-pointer">
      <div className="w-1 h-1 bg-white rounded-full"></div>
      <div className="w-1 h-1 bg-white rounded-full"></div>
      <div className="w-1 h-1 bg-white rounded-full"></div>
     </button>
    </div>
    <div className="flex justify-around border-t border-teal-700/50 mt-3 pt-3 pb-2">
     <NavBtn icon={<Ic.Users/>} label="អ្នកជំងឺទាំងអស់" val="patients"/>
     <NavBtn icon={<Ic.Calendar/>} label="តារាងណាត់ជួប" val="appointments"/>
     <NavBtn icon={<Ic.Activity/>} label="សេវាកម្ម និងតម្លៃ" val="services"/>
     <NavBtn icon={<Ic.Bar/>} label="របាយការណ៍" val="reports"/>
    </div>
   </div>
  </header>

  {toast&&<div className="fixed bottom-24 right-5 z-50 bg-slate-800 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-medium flex items-center gap-2 no-print fade">
   <span className="w-2 h-2 rounded-full bg-emerald-400"></span>{toast}</div>}

  <main className="max-w-md mx-auto p-4 space-y-3 no-print">
   {/* ==== PATIENTS ==== */}
   {view==="patients"&&<>
    <div className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-2">
     <div className="relative flex-1">
      <input type="text" placeholder="ស្វែងរក..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full pl-8 pr-2 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-teal-500"/>
      <div className="absolute left-2.5 top-2.5 text-slate-400"><Ic.Search/></div>
     </div>
     <button onClick={newPat} className="bg-teal-600 hover:bg-teal-700 text-white p-2.5 rounded-xl cursor-pointer shadow-sm"><Ic.Plus/></button>
    </div>

    {filtered.length===0?<div className="bg-white p-8 rounded-2xl text-center text-slate-400 border border-dashed border-slate-200 text-xs">មិនមានទិន្នន័យ</div>:
    filtered.map(p=>{
     const tc=p.services.reduce((a,c)=>a+c.price,0);
     const tp=p.payments.reduce((a,c)=>a+c.amount,0);
     const bal=tc-tp;const sel=selId===p.id;
     return(<div key={p.id} className={`bg-white rounded-2xl border overflow-hidden shadow-sm ${sel?'border-teal-500 ring-2 ring-teal-500/20':'border-slate-100'}`}>
      <div onClick={()=>{setSelId(sel?null:p.id);setTab("overview")}} className={`p-3.5 cursor-pointer ${sel?'bg-teal-50/80 border-b border-teal-100':''}`}>
       <div className="flex items-start justify-between gap-2">
        <div className="min-w-0 flex-1">
         <div className="flex items-center gap-1.5 flex-wrap">
          <span className="font-bold text-slate-900 text-sm">{p.name}</span>
          <span className="text-[9px] bg-slate-200 text-slate-700 font-bold px-1.5 py-0.5 rounded-full font-mono">{p.id}</span>
         </div>
         <p className="text-[11px] text-slate-500 mt-0.5">📞 {p.phone} • {p.gender} ({p.age})</p>
        </div>
        <span className={`text-[10px] font-bold px-2 py-1 rounded-full whitespace-nowrap ${bal<=0?'bg-emerald-100 text-emerald-800':'bg-amber-100 text-amber-800'}`}>{bal<=0?'បង់រួច':`ជំពាក់ ${M(bal)}`}</span>
       </div>
       <div className="flex items-center justify-between text-[10px] text-slate-500 border-t border-slate-200/60 pt-1.5 mt-1.5">
        <span>សេវា {p.services.length}</span>
        <span className="font-medium text-slate-700">សរុប {M(tc)} {sel?'▲':'▼'}</span>
       </div>
      </div>

      {sel&&<div className="p-3.5 space-y-3 bg-white fade">
       <div className="grid grid-cols-4 gap-1.5">
        <button onClick={()=>editPatOpen(p)} className="py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 text-[10px] font-bold flex flex-col items-center gap-0.5 cursor-pointer"><Ic.Edit/><span>កែ</span></button>
        <button onClick={()=>setPayM({open:true,patient:p,amount:"",note:""})} className="py-2 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-[10px] font-bold flex flex-col items-center gap-0.5 cursor-pointer"><Ic.Dollar/><span>បង់ប្រាក់</span></button>
        <button onClick={()=>setPosM(p)} className="py-2 rounded-xl bg-slate-50 border border-slate-200 text-slate-700 text-[10px] font-bold flex flex-col items-center gap-0.5 cursor-pointer"><Ic.Printer/><span>POS</span></button>
        <button onClick={()=>setDelM({open:true,type:"PATIENT",targetId:p.id,title:"លុបអ្នកជំងឺ",text:"តើអ្នកចង់លុបមែនទេ?"})} className="py-2 rounded-xl bg-red-50 border border-red-200 text-red-600 text-[10px] font-bold flex flex-col items-center gap-0.5 cursor-pointer"><Ic.Trash/><span>លុប</span></button>
       </div>

       <div className="grid grid-cols-3 gap-1.5">
        <div className="bg-slate-50 p-2 rounded-xl border border-slate-200 text-center"><div className="text-[9px] text-slate-500">សរុប</div><div className="font-bold text-slate-800 text-xs mt-0.5">{M(tc)}</div></div>
        <div className="bg-emerald-50 p-2 rounded-xl border border-emerald-200 text-center"><div className="text-[9px] text-emerald-700">បង់</div><div className="font-bold text-emerald-800 text-xs mt-0.5">{M(tp)}</div></div>
        <div className="bg-amber-50 p-2 rounded-xl border border-amber-200 text-center"><div className="text-[9px] text-amber-700">ខ្វះ</div><div className="font-bold text-amber-800 text-xs mt-0.5">{M(bal)}</div></div>
       </div>

       <div className="flex border-b border-slate-200 text-[11px] font-bold gap-1">
        <button onClick={()=>setTab("overview")} className={`py-1.5 px-2 border-b-2 cursor-pointer ${tab==='overview'?'border-teal-600 text-teal-700':'border-transparent text-slate-500'}`}>ទូទៅ</button>
        <button onClick={()=>setTab("appointments")} className={`py-1.5 px-2 border-b-2 cursor-pointer ${tab==='appointments'?'border-teal-600 text-teal-700':'border-transparent text-slate-500'}`}>ណាត់ ({p.appointments.length})</button>
        <button onClick={()=>setTab("payments")} className={`py-1.5 px-2 border-b-2 cursor-pointer ${tab==='payments'?'border-teal-600 text-teal-700':'border-transparent text-slate-500'}`}>ទូទាត់ ({p.payments.length})</button>
       </div>

       {tab==="overview"&&<div className="space-y-2">
        {p.services.map((s,i)=><div key={i} className="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex justify-between items-center">
         <div className="min-w-0 flex-1"><p className="font-bold text-slate-800 text-[11px] truncate">{s.name}</p><p className="text-[10px] text-teal-700">ធ្មេញ: {s.teeth&&s.teeth.length>0?s.teeth.slice().sort((a,b)=>a-b).join(', '):'ទូទៅ'}</p></div>
         <span className="font-bold text-slate-900 text-xs ml-2">{M(s.price)}</span>
        </div>)}
        {p.notes&&<div className="p-2.5 bg-amber-50 border border-amber-200 rounded-xl text-[11px]"><span className="font-bold text-amber-900 block text-[10px] mb-0.5">កត់ចំណាំ:</span><span className="text-amber-800">{p.notes}</span></div>}
       </div>}

       {tab==="appointments"&&<div className="space-y-2">
        <button onClick={()=>setAppM({open:true,patientId:p.id,date:tI(),time:"09:00",note:""})} className="w-full bg-teal-600 hover:bg-teal-700 text-white py-2 rounded-xl text-xs font-bold cursor-pointer flex items-center justify-center gap-1"><Ic.Plus/> បន្ថែមណាត់ជួប</button>
        {p.appointments.length===0?<div className="text-center py-4 text-[11px] text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200">មិនទាន់មាន</div>:
        p.appointments.map(a=><div key={a.id} className="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex justify-between items-start gap-2">
         <div className="min-w-0 flex-1">
          <div className="flex items-center gap-1.5 flex-wrap">
           <span className="font-bold text-slate-800 text-[11px]">{fD(a.date)} {a.time}</span>
           <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${a.status==='រួចរាល់'?'bg-emerald-100 text-emerald-800':a.status==='លុបចោល'?'bg-rose-100 text-rose-800':'bg-amber-100 text-amber-800'}`}>{a.status}</span>
          </div>
          <p className="text-[10px] text-slate-500 mt-0.5">{a.note}</p>
         </div>
         <div className="flex flex-col gap-1">
          {a.status==='កំពុងរង់ចាំ'&&<button onClick={()=>togApp(p.id,a.id,"រួចរាល់")} className="px-2 py-1 bg-emerald-600 text-white text-[10px] font-bold rounded-lg cursor-pointer whitespace-nowrap">រួចរាល់</button>}
          <button onClick={()=>setDelM({open:true,type:"APPOINTMENT",targetId:a.id,title:"លុបណាត់ជួប",text:"លុបមែនទេ?"})} className="p-1 text-slate-400 hover:text-red-600 self-end cursor-pointer"><Ic.Trash/></button>
         </div>
        </div>)}
       </div>}

       {tab==="payments"&&<div className="space-y-2">
        <button onClick={()=>setPayM({open:true,patient:p,amount:"",note:""})} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-bold cursor-pointer flex items-center justify-center gap-1"><Ic.Dollar/> បង់ប្រាក់បន្ថែម</button>
        {p.payments.length===0?<div className="text-center py-4 text-[11px] text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200">មិនទាន់មាន</div>:
        p.payments.map(pm=><div key={pm.id} className="p-2.5 rounded-xl bg-slate-50 border border-slate-200 flex justify-between items-center">
         <div><span className="font-bold text-emerald-700 text-xs block">{M(pm.amount)}</span><span className="text-[10px] text-slate-500">{fD(pm.date)} • {pm.note}</span></div>
         <button onClick={()=>setDelM({open:true,type:"PAYMENT",targetId:pm.id,title:"លុបទូទាត់",text:"លុបមែនទេ?"})} className="p-1 text-slate-400 hover:text-red-600 cursor-pointer"><Ic.Trash/></button>
        </div>)}
       </div>}
      </div>}
     </div>)})}
   </>}

   {/* ==== APPOINTMENTS ==== */}
   {view==="appointments"&&<div className="space-y-3">
    <div className="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-2">
     <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)} className="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs"/>
     {filterDate&&<button onClick={()=>setFilterDate("")} className="text-[11px] text-teal-700 font-bold cursor-pointer">ទាំងអស់</button>}
    </div>
    {(()=>{const all=patients.flatMap(p=>(p.appointments||[]).map(a=>({...a,pid:p.id,pn:p.name,pp:p.phone}))).filter(a=>!filterDate||a.date===filterDate);
     return all.length===0?<div className="bg-white text-center py-10 text-xs text-slate-400 rounded-2xl border border-dashed border-slate-200">មិនមានណាត់ជួប</div>:
     all.map(a=><div key={a.id} className="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 space-y-2">
      <div className="flex items-center justify-between gap-2">
       <span className="font-bold text-slate-900 text-sm">{a.pn}</span>
       <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${a.status==='រួចរាល់'?'bg-emerald-100 text-emerald-800':a.status==='លុបចោល'?'bg-rose-100 text-rose-800':'bg-amber-100 text-amber-800'}`}>{a.status}</span>
      </div>
      <p className="text-[11px] text-slate-500">📞 {a.pp}</p>
      <p className="text-[11px] text-teal-700 font-semibold">📅 {fD(a.date)} {a.time} • {a.note}</p>
      <div className="flex gap-2 pt-1">
       {a.status==='កំពុងរង់ចាំ'&&<button onClick={()=>togApp(a.pid,a.id,"រួចរាល់")} className="flex-1 bg-emerald-600 text-white py-1.5 rounded-xl text-[11px] font-bold cursor-pointer">រួចរាល់</button>}
       <button onClick={()=>{setSelId(a.pid);setView("patients")}} className="flex-1 bg-white border border-slate-200 text-slate-700 py-1.5 rounded-xl text-[11px] font-bold cursor-pointer">មើលអ្នកជំងឺ</button>
      </div>
     </div>);})()}
   </div>}

   {/* ==== SERVICES ==== */}
   {view==="services"&&<div className="space-y-3">
    <button onClick={()=>{setEditServ(null);setServForm({name:"",price:""});setServM(true)}} className="w-full bg-teal-600 hover:bg-teal-700 text-white py-2.5 rounded-2xl text-xs font-bold cursor-pointer flex items-center justify-center gap-1 shadow-sm"><Ic.Plus/> បន្ថែមសេវាកម្មថ្មី</button>
    {services.map(s=><div key={s.id} className="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between gap-2">
     <div className="min-w-0 flex-1"><p className="font-bold text-slate-800 text-xs truncate">{s.name}</p><p className="font-bold text-teal-700 text-sm mt-0.5">{M(s.price)}</p></div>
     <div className="flex gap-1">
      <button onClick={()=>{setEditServ(s);setServForm({name:s.name,price:s.price.toString()});setServM(true)}} className="p-2 rounded-lg bg-slate-50 text-slate-600 hover:bg-slate-100 cursor-pointer"><Ic.Edit/></button>
      <button onClick={()=>setDelM({open:true,type:"SERVICE",targetId:s.id,title:"លុបសេវា",text:`លុប "${s.name}"?`})} className="p-2 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 cursor-pointer"><Ic.Trash/></button>
     </div>
    </div>)}
   </div>}

   {/* ==== REPORTS ==== */}
   {view==="reports"&&<ReportsView patients={patients} clinic={clinic}/>}
  </main>

  {/* ============ MODALS ============ */}
  {regOpen&&<div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto no-print">
   <div className="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto fade">
    <div className="flex justify-between items-center border-b border-slate-100 pb-2.5 sticky top-0 bg-white">
     <h3 className="font-bold text-slate-800 text-sm">{editPat?'កែប្រែព័ត៌មាន':'ចុះឈ្មោះអ្នកជំងឺថ្មី'}</h3>
     <button onClick={()=>setRegOpen(false)} className="text-slate-400 font-bold cursor-pointer text-lg">✕</button>
    </div>
    <form onSubmit={savePat} className="space-y-3 text-xs">
     <div className="grid grid-cols-2 gap-2">
      <div className="col-span-2"><label className="block font-semibold text-slate-700 mb-1">ឈ្មោះ *</label><input type="text" required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500"/></div>
      <div className="col-span-2"><label className="block font-semibold text-slate-700 mb-1">ទូរស័ព្ទ *</label><input type="text" required value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-teal-500"/></div>
      <div><label className="block font-semibold text-slate-700 mb-1">ភេទ</label><select value={form.gender} onChange={e=>setForm({...form,gender:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"><option value="ស្រី">ស្រី</option><option value="ប្រុស">ប្រុស</option></select></div>
      <div><label className="block font-semibold text-slate-700 mb-1">អាយុ</label><input type="number" value={form.age} onChange={e=>setForm({...form,age:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"/></div>
     </div>
     <div className="space-y-2">
      <div className="flex justify-between items-center">
       <label className="font-bold text-slate-800 text-xs">សេវាកម្ម</label>
       <button type="button" onClick={()=>setForm({...form,services:[...form.services,{id:`s${Date.now()}`,name:"",teeth:[],price:""}]})} className="text-teal-700 font-bold text-[11px] cursor-pointer">+ បន្ថែម</button>
      </div>
      {form.services.map((sv,idx)=><div key={sv.id||idx} className="p-2.5 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
       <div className="flex gap-2 items-center">
        <select value={sv.name} onChange={e=>{const ps=services.find(p=>p.name===e.target.value);const u=[...form.services];u[idx].name=e.target.value;if(ps)u[idx].price=ps.price;setForm({...form,services:u})}} className="flex-1 p-2 border border-slate-200 rounded-lg bg-white text-[11px]">
         <option value="">-- ជ្រើស --</option>
         {services.map(ps=><option key={ps.id} value={ps.name}>{ps.name} (${ps.price})</option>)}
        </select>
        <input type="number" placeholder="តម្លៃ" value={sv.price} onChange={e=>{const u=[...form.services];u[idx].price=e.target.value;setForm({...form,services:u})}} className="w-20 p-2 border border-slate-200 rounded-lg bg-white text-[11px] font-bold"/>
        {form.services.length>1&&<button type="button" onClick={()=>setForm({...form,services:form.services.filter((_,i)=>i!==idx)})} className="text-red-500 p-1 cursor-pointer"><Ic.Trash/></button>}
       </div>
       <ToothSel selected={sv.teeth||[]} onToggle={t=>{const u=[...form.services];const c=u[idx].teeth||[];u[idx].teeth=c.includes(t)?c.filter(x=>x!==t):[...c,t];setForm({...form,services:u})}}/>
      </div>)}
     </div>
     {!editPat&&<div className="grid grid-cols-2 gap-2">
      <div><label className="block font-semibold text-slate-700 mb-1">ប្រាក់កក់ ($)</label><input type="number" value={form.deposit} onChange={e=>setForm({...form,deposit:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-emerald-700"/></div>
      <div><label className="block font-semibold text-slate-700 mb-1">ណាត់ជួបដំបូង</label><input type="date" value={form.firstAppDate} onChange={e=>setForm({...form,firstAppDate:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"/></div>
     </div>}
     <div><label className="block font-semibold text-slate-700 mb-1">ចំណាំ</label><textarea rows="2" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"></textarea></div>
     <div className="flex gap-2 pt-2 sticky bottom-0 bg-white">
      <button type="button" onClick={()=>setRegOpen(false)} className="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold cursor-pointer">បោះបង់</button>
      <button type="submit" className="flex-1 py-2.5 rounded-xl bg-teal-600 text-white font-bold cursor-pointer">រក្សាទុក</button>
     </div>
    </form>
   </div>
  </div>}

  {payM.open&&<div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 no-print">
   <div className="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-3 fade">
    <h3 className="font-bold text-slate-800 text-sm">កត់ត្រាការទូទាត់</h3>
    <p className="text-[11px] text-slate-500">អ្នកជំងឺ: <span className="font-bold text-slate-800">{payM.patient?.name}</span></p>
    <div className="space-y-2 text-xs">
     <div><label className="block font-semibold mb-1">ចំនួន ($) *</label><input type="number" value={payM.amount} onChange={e=>setPayM({...payM,amount:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-emerald-700 text-base"/></div>
     <div><label className="block font-semibold mb-1">កត់ចំណាំ</label><input type="text" value={payM.note} onChange={e=>setPayM({...payM,note:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"/></div>
    </div>
    <div className="flex gap-2 pt-1">
     <button onClick={()=>setPayM({open:false,patient:null,amount:"",note:""})} className="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold text-xs cursor-pointer">បោះបង់</button>
     <button onClick={addPay} className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs cursor-pointer">រក្សាទុក</button>
    </div>
   </div>
  </div>}

  {appM.open&&<div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 no-print">
   <div className="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-3 fade">
    <h3 className="font-bold text-slate-800 text-sm">បន្ថែមការណាត់ជួបថ្មី</h3>
    <div className="space-y-2 text-xs">
     <div><label className="block font-semibold mb-1">កាលបរិច្ឆេទ</label><input type="date" value={appM.date} onChange={e=>setAppM({...appM,date:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"/></div>
     <div><label className="block font-semibold mb-1">ម៉ោង</label><input type="time" value={appM.time} onChange={e=>setAppM({...appM,time:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"/></div>
     <div><label className="block font-semibold mb-1">ចំណាំ</label><input type="text" value={appM.note} onChange={e=>setAppM({...appM,note:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"/></div>
    </div>
    <div className="flex gap-2 pt-1">
     <button onClick={()=>setAppM({open:false,patientId:"",date:tI(),time:"09:00",note:""})} className="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold text-xs cursor-pointer">បោះបង់</button>
     <button onClick={addApp} className="flex-1 py-2.5 rounded-xl bg-teal-600 text-white font-bold text-xs cursor-pointer">រក្សាទុក</button>
    </div>
   </div>
  </div>}

  {servM&&<div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 no-print">
   <div className="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-3 fade">
    <h3 className="font-bold text-slate-800 text-sm">{editServ?'កែសេវាកម្ម':'បន្ថែមសេវាកម្មថ្មី'}</h3>
    <form onSubmit={saveServ} className="space-y-2 text-xs">
     <div><label className="block font-semibold mb-1">ឈ្មោះ *</label><input type="text" required value={servForm.name} onChange={e=>setServForm({...servForm,name:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"/></div>
     <div><label className="block font-semibold mb-1">តម្លៃ ($) *</label><input type="number" required value={servForm.price} onChange={e=>setServForm({...servForm,price:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-teal-800"/></div>
     <div className="flex gap-2 pt-2">
      <button type="button" onClick={()=>setServM(false)} className="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold cursor-pointer">បោះបង់</button>
      <button type="submit" className="flex-1 py-2.5 rounded-xl bg-teal-600 text-white font-bold cursor-pointer">រក្សាទុក</button>
     </div>
    </form>
   </div>
  </div>}

  {clinicM&&<div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 no-print">
   <div className="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-5 shadow-2xl space-y-3 fade">
    <h3 className="font-bold text-slate-800 text-sm">ការកំណត់គ្លីនិក</h3>
    <div className="space-y-2 text-xs">
     <div><label className="block font-semibold mb-1">ឈ្មោះ</label><input type="text" value={clinic.name} onChange={e=>setClinic({...clinic,name:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"/></div>
     <div><label className="block font-semibold mb-1">Subtitle</label><input type="text" value={clinic.subtitle} onChange={e=>setClinic({...clinic,subtitle:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"/></div>
     <div><label className="block font-semibold mb-1">ទូរស័ព្ទ</label><input type="text" value={clinic.phone} onChange={e=>setClinic({...clinic,phone:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"/></div>
     <div><label className="block font-semibold mb-1">អាសយដ្ឋាន</label><input type="text" value={clinic.address} onChange={e=>setClinic({...clinic,address:e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl"/></div>
    </div>
    <button onClick={()=>setClinicM(false)} className="w-full py-2.5 rounded-xl bg-teal-600 text-white font-bold text-xs cursor-pointer">រក្សាទុក</button>
   </div>
  </div>}

  {delM.open&&<div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 no-print">
   <div className="bg-white rounded-2xl max-w-xs w-full p-5 shadow-2xl space-y-3">
    <h3 className="font-bold text-red-600 text-sm">{delM.title}</h3>
    <p className="text-[11px] text-slate-600">{delM.text}</p>
    <div className="flex gap-2 pt-1">
     <button onClick={()=>setDelM({open:false,type:"",targetId:"",title:"",text:""})} className="flex-1 py-2 rounded-xl bg-slate-100 font-bold text-xs cursor-pointer">បោះបង់</button>
     <button onClick={execDel} className="flex-1 py-2 rounded-xl bg-red-600 text-white font-bold text-xs cursor-pointer">លុប</button>
    </div>
   </div>
  </div>}

  {posM&&<div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
   <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-3 no-print">
    <div className="flex justify-between items-center border-b border-slate-100 pb-2">
     <h3 className="font-bold text-slate-800 text-xs">វិក្កយបត្រ POS (80mm)</h3>
     <button onClick={()=>setPosM(null)} className="text-slate-400 font-bold cursor-pointer">✕</button>
    </div>
    <div className="border border-slate-200 p-3 rounded-xl bg-slate-50 text-[10px] font-mono space-y-1.5">
     <div className="text-center">
      <p className="font-bold text-xs">{clinic.name}</p>
      <p className="text-[9px] text-slate-500">{clinic.address}</p>
      <p className="text-[9px] text-slate-500">ទូរស័ព្ទ: {clinic.phone}</p>
      <p className="font-bold border-b border-dashed border-slate-300 py-1 my-1 text-[10px]">វិក្កយបត្រ</p>
     </div>
     <div className="text-slate-700">
      <p>អតិថិជន: <strong>{posM.name}</strong></p>
      <p>ទូរស័ព្ទ: {posM.phone}</p>
      <p>កាលបរិច្ឆេទ: {tI()}</p>
     </div>
     <div className="border-t border-b border-dashed border-slate-300 py-1.5 space-y-1">
      {posM.services.map((s,i)=><div key={i} className="flex justify-between">
       <div className="min-w-0 flex-1"><p className="font-bold truncate">{s.name}</p><p className="text-[9px] text-slate-500">ធ្មេញ: {s.teeth.join(', ')||'ទូទៅ'}</p></div>
       <span className="font-bold ml-2">{M(s.price)}</span>
      </div>)}
     </div>
     {(()=>{const tot=posM.services.reduce((a,b)=>a+b.price,0);const paid=posM.payments.reduce((a,b)=>a+b.amount,0);return(
      <div className="space-y-1">
       <div className="flex justify-between font-bold"><span>សរុប:</span><span>{M(tot)}</span></div>
       <div className="flex justify-between text-emerald-700 font-bold"><span>បង់:</span><span>{M(paid)}</span></div>
       <div className="flex justify-between text-amber-800 font-bold border-t border-slate-200 pt-1"><span>ខ្វះ:</span><span>{M(tot-paid)}</span></div>
      </div>)})()}
     <p className="text-center text-[9px] text-slate-500 pt-2 italic">{clinic.footerNote}</p>
    </div>
    <div className="flex gap-2">
     <button onClick={()=>setPosM(null)} className="flex-1 py-2 rounded-xl bg-slate-100 font-bold text-xs cursor-pointer">បិទ</button>
     <button onClick={()=>window.print()} className="flex-1 py-2 rounded-xl bg-teal-600 text-white font-bold text-xs cursor-pointer flex items-center justify-center gap-1"><Ic.Printer/>បោះពុម្ព</button>
    </div>
   </div>
   <div className="hidden pp">
    <div style={{textAlign:'center',marginBottom:'8px'}}>
     <h2 style={{fontSize:'13px',fontWeight:'bold'}}>{clinic.name}</h2>
     <p style={{fontSize:'10px'}}>{clinic.address}</p>
     <p style={{fontSize:'10px'}}>ទូរស័ព្ទ: {clinic.phone}</p>
     <div style={{borderBottom:'1px dashed #000',margin:'4px 0'}}></div>
     <h3 style={{fontSize:'11px',fontWeight:'bold'}}>វិក្កយបត្រ</h3>
    </div>
    <div style={{fontSize:'10px',marginBottom:'8px'}}>
     <p>អ្នកជំងឺ: <strong>{posM.name}</strong></p>
     <p>ទូរស័ព្ទ: {posM.phone}</p>
     <p>កាលបរិច្ឆេទ: {tI()}</p>
    </div>
    <div style={{borderTop:'1px dashed #000',borderBottom:'1px dashed #000',padding:'4px 0',marginBottom:'8px'}}>
     {posM.services.map((s,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:'10px',marginBottom:'3px'}}>
      <span>{s.name} ({s.teeth.join(',')||'ទូទៅ'})</span><span style={{fontWeight:'bold'}}>${s.price}</span>
     </div>)}
    </div>
    {(()=>{const tot=posM.services.reduce((a,b)=>a+b.price,0);const paid=posM.payments.reduce((a,b)=>a+b.amount,0);return(
     <div style={{fontSize:'10px',lineHeight:'1.4'}}>
      <div style={{display:'flex',justifyContent:'space-between'}}><span>សរុប:</span><strong>${tot}</strong></div>
      <div style={{display:'flex',justifyContent:'space-between'}}><span>បង់:</span><strong>${paid}</strong></div>
      <div style={{display:'flex',justifyContent:'space-between',borderTop:'1px solid #000',paddingTop:'2px'}}><span>ខ្វះ:</span><strong>${tot-paid}</strong></div>
     </div>)})()}
    <div style={{textAlign:'center',marginTop:'12px',fontSize:'9px'}}><p>{clinic.footerNote}</p></div>
   </div>
  </div>}

  {/* Floating Sparkle → Reports */}
  <button onClick={()=>setView("reports")} className="fixed bottom-5 right-5 z-40 w-12 h-12 bg-slate-900 rounded-full flex items-center justify-center text-yellow-400 shadow-lg cursor-pointer no-print"><Ic.Spark/></button>
 </div>);
}

class ErrB extends Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}componentDidCatch(e,i){console.error(e,i)}render(){if(this.state.e)return(<div className="p-6 max-w-lg mx-auto my-10 bg-red-50 border border-red-200 rounded-2xl text-red-800 text-xs space-y-2"><h3 className="font-bold">មានបញ្ហា</h3><p>{this.state.e.toString()}</p><button onClick={()=>{localStorage.clear();window.location.reload()}} className="px-3 py-1 bg-red-600 text-white rounded-lg font-bold cursor-pointer">Reset</button></div>);return this.props.children}}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrB><App/></ErrB>);
</script>
</body>
</html>
