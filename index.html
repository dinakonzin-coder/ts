/* ========== CONSTANTS ========== */

const KHMER_MONTHS=['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];

const safeGetStorage=(k,f)=>{try{const i=localStorage.getItem(k);return i?JSON.parse(i):f;}catch(e){return f;}};
const safeSetStorage=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const formatMoney=(a)=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(a||0);
const formatDate=(s)=>{if(!s)return'';const d=new Date(s);return isNaN(d.getTime())?s:d.toLocaleDateString('km-KH',{year:'numeric',month:'short',day:'numeric'});};
const getTodayIso=()=>new Date().toISOString().split('T')[0];
const khmerMonthToIso=(str)=>{if(!str)return'';const p=str.split(' ');if(p.length<2)return'';const idx=KHMER_MONTHS.indexOf(p[0]);if(idx<0)return'';return `${p[1]}-${String(idx+1).padStart(2,'0')}`;};

};

      {id:"a2",date:"2026-10-15",time:"14:00",note:"ដាំក្បាលធ្មេញ Crown",status:"កំពុងរង់ចាំ"}

    createdAt:"2026-09-25",notes:"កញ្ចប់ពត់ធ្មេញ ២ឆ្នាំ",

  Calendar:()=><SvgIcon d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>,
  Printer:()=><SvgIcon d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>,
  Dollar:()=><SvgIcon d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V6m0 12v-2m0 0c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>,
  Settings:()=><SvgIcon d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>,
  Edit:()=><SvgIcon d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>,
  Trash:()=><SvgIcon d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>,
  Chart:()=><SvgIcon cls="w-4 h-4 inline-block" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 012 2h2a2 2 0 012-2z"/>,
  BarChart3:()=><SvgIcon cls="w-4 h-4 inline-block" d="M3 3v18h18M7 16v-4m5 4V8m5 8v-6"/>,
  ChevronDown:()=><SvgIcon cls="w-3.5 h-3.5" d="M19 9l-7 7-7-7"/>,
  Sparkles:()=><SvgIcon cls="w-5 h-5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>,
  Users:()=><SvgIcon d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
};

/* ========== TOOTH SELECTOR ========== */
function ToothSelector({selectedTeeth=[],onToggleTooth,label}){
  const renderTooth=(t)=>{
    const s=selectedTeeth.includes(t);
    return (
      <button type="button" key={t} onClick={()=>onToggleTooth(t)}
        className={`w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center border cursor-pointer ${s?'bg-teal-600 text-white border-teal-700 shadow-sm scale-105':'bg-white text-slate-700 border-slate-200 hover:border-teal-400 hover:bg-teal-50'}`}>
        {t}
      </button>
    );
  };
  return (
    <div className="space-y-1">
      {label&&<label className="block text-xs font-semibold text-slate-700 mb-1">{label}</label>}
      <div className="bg-slate-100/90 p-3 rounded-2xl border border-slate-200 overflow-x-auto max-w-full">
        <div className="min-w-max flex flex-col items-center gap-2">
          <div className="flex items-center gap-1 flex-nowrap">
            <span className="text-[11px] font-bold text-teal-700 mr-1 w-10 text-right">លើ:</span>
            <div className="flex items-center gap-1">{UPPER_TEETH_RIGHT.map(renderTooth)}</div>
            <div className="w-px h-6 bg-slate-300 mx-1.5"></div>
            <div className="flex items-center gap-1">{UPPER_TEETH_LEFT.map(renderTooth)}</div>
          </div>
          <div className="w-full border-t border-slate-200 my-0.5"></div>
          <div className="flex items-center gap-1 flex-nowrap">
            <span className="text-[11px] font-bold text-teal-700 mr-1 w-10 text-right">ក្រោម:</span>
            <div className="flex items-center gap-1">{LOWER_TEETH_RIGHT.map(renderTooth)}</div>
            <div className="w-px h-6 bg-slate-300 mx-1.5"></div>
            <div className="flex items-center gap-1">{LOWER_TEETH_LEFT.map(renderTooth)}</div>
          </div>
        </div>
      </div>
      <p className="text-[11px] text-teal-700 font-semibold pt-1">
        ធ្មេញជ្រើសរើស: {selectedTeeth.length>0?selectedTeeth.slice().sort((a,b)=>a-b).join(', '):'គ្មាន (ទូទៅ)'}
      </p>
    </div>
  );
}

/* ============================================================
   REPORTS VIEW (កូដទី២ — ភ្ជាប់ទៅទិន្នន័យពិត)
   ============================================================ */
function ReportsView({patients,clinicInfo}){
  const today=new Date();
  const currentYear=today.getFullYear();
  const currentMonthIndex=today.getMonth();
  const currentDayFormatted=today.toISOString().split('T')[0];
  const defaultMonthStr=`${KHMER_MONTHS[currentMonthIndex]} ${currentYear}`;

  const [reportType,setReportType]=useState('monthly');
  const [selectedDate,setSelectedDate]=useState(currentDayFormatted);
  const [selectedMonth,setSelectedMonth]=useState(defaultMonthStr);
  const [isPickerOpen,setIsPickerOpen]=useState(false);

  const generateOptions=()=>{
    const opts=[];
    if(reportType==='monthly'){
      for(let y=currentYear-2;y<=currentYear+10;y++)
        for(let m=0;m<12;m++) opts.push(`${KHMER_MONTHS[m]} ${y}`);
    } else {
      for(let i=0;i<60;i++){
        const d=new Date();d.setDate(today.getDate()-i);
        opts.push(d.toISOString().split('T')[0]);
      }
    }
    return opts;
  };
  const options=generateOptions();

  // ISO key for filtering: daily="2026-10-06", monthly="2026-10"
  const filterKey = reportType==='daily' ? selectedDate : khmerMonthToIso(selectedMonth);
  const inRange=(ds)=>ds && ds.startsWith(filterKey);

  const payments=patients.flatMap(p=>(p.payments||[]).map(pm=>({...pm,patientName:p.name,patientPhone:p.phone})))
                          .filter(pm=>inRange(pm.date));
  const newPats=patients.filter(p=>inRange(p.createdAt));
  const apps=patients.flatMap(p=>(p.appointments||[]).map(a=>({...a,patientName:p.name,patientPhone:p.phone})))
                       .filter(a=>inRange(a.date));

  const totalRevenue=payments.reduce((s,p)=>s+p.amount,0);
  const completedApps=apps.filter(a=>a.status==='រួចរាល់');
  const newServicesBilled=newPats.reduce((s,p)=>s+(p.services||[]).reduce((ss,sv)=>ss+sv.price,0),0);
  const avgRevenue=payments.length>0?totalRevenue/payments.length:0;

  const title = reportType==='daily' ? 'របាយការណ៍បូកសរុបប្រចាំថ្ងៃ' : 'របាយការណ៍បូកសរុបប្រចាំខែ';
  const subtitle = reportType==='daily'
    ? 'តាមការចំណូល ចំនួនអ្នកជំងឺ និងការណាត់ជួបប្រចាំថ្ងៃ'
    : 'តាមការចំណូល ចំនួនអ្នកជំងឺ និងការណាត់ជួបប្រចាំខែ';
  const periodLabel = reportType==='daily' ? `កាលបរិច្ឆេទ: ${selectedDate}` : `ខែ: ${selectedMonth}`;

  const handlePrintPOS=()=>{
    const w=window.open('','_blank','width=350,height=600');
    if(!w) return;
    w.document.write(`
      <html><head><title>POS - ${title}</title>
      <style>
        body{font-family:'Courier New',monospace;width:300px;margin:0 auto;padding:10px;color:#000;background:#fff;}
        .center{text-align:center;} .bold{font-weight:bold;}
        .line{border-bottom:1px dashed #000;margin:8px 0;}
        .flex{display:flex;justify-content:space-between;}
        .small{font-size:11px;} .title{font-size:14px;font-weight:bold;margin-bottom:4px;}
      </style></head><body>
      <div class="center title">${clinicInfo.name}</div>
      <div class="center small">${clinicInfo.subtitle}</div>
      <div class="line"></div>
      <div class="center bold">${title}</div>
      <div class="center small">${periodLabel}</div>
      <div class="line"></div>
      <div class="flex"><span>ប្រាក់ចំណូលសរុប:</span><span class="bold">${formatMoney(totalRevenue)}</span></div>
      <div class="small" style="margin-bottom:6px;">ប្រតិបត្តិការបង់ប្រាក់: ${payments.length} លើក</div>
      <div class="flex"><span>អ្នកជំងឺថ្មី:</span><span class="bold">${newPats.length} នាក់</span></div>
      <div class="small" style="margin-bottom:6px;">ថ្លៃសេវា: ${formatMoney(newServicesBilled)}</div>
      <div class="flex"><span>ការណាត់ជួប:</span><span class="bold">${apps.length} ដង</span></div>
      <div class="small" style="margin-bottom:6px;">ព្យាបាលរួចរាល់: ${completedApps.length} ដង</div>
      <div class="flex"><span>មធ្យមភាគ:</span><span class="bold">${formatMoney(avgRevenue)}</span></div>
      <div class="line"></div>
      <div class="center small">${clinicInfo.footerNote}</div>
      <div class="center small">បោះពុម្ព: ${new Date().toLocaleString()}</div>
      </body></html>`);
    w.document.close();
    w.focus();
    setTimeout(()=>{w.print();w.close();},300);
  };

  const handleSelect=(v)=>{
    if(reportType==='daily') setSelectedDate(v);
    else setSelectedMonth(v);
    setIsPickerOpen(false);
  };
  const currentVal = reportType==='daily' ? selectedDate : selectedMonth;

  return (
    <div className="space-y-4">
      {/* Toggle Daily/Monthly */}
      <div className="bg-slate-200 p-1 rounded-xl flex shadow-inner no-print">
        <button onClick={()=>{setReportType('daily');setIsPickerOpen(false);}}
          className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition-all flex items-center justify-center gap-2 cursor-pointer ${reportType==='daily'?'bg-teal-700 text-white shadow-md':'text-slate-600 hover:text-slate-900'}`}>
          <Icons.Calendar/> របាយការណ៍ប្រចាំថ្ងៃ
        </button>
        <button onClick={()=>{setReportType('monthly');setIsPickerOpen(false);}}
          className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition-all flex items-center justify-center gap-2 cursor-pointer ${reportType==='monthly'?'bg-teal-700 text-white shadow-md':'text-slate-600 hover:text-slate-900'}`}>
          <Icons.BarChart3/> របាយការណ៍ប្រចាំខែ
        </button>
      </div>

      {/* Header + picker + print */}
      <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <div>
          <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
            <span className="text-teal-600"><Icons.BarChart3/></span> {title}
          </h2>
          <p className="text-xs text-slate-500 mt-0.5">{subtitle}</p>
        </div>
        <div className="flex items-center justify-between pt-2 gap-2 flex-wrap">
          <div className="relative inline-block">
            <button onClick={()=>setIsPickerOpen(!isPickerOpen)}
              className="flex items-center gap-2 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 transition shadow-sm cursor-pointer">
              <span>{reportType==='daily'?`កាលបរិច្ឆេទ: ${selectedDate}`:`ខែ: ${selectedMonth}`}</span>
              <span className={`text-slate-400 transition-transform ${isPickerOpen?'rotate-180':''}`}>
                <Icons.ChevronDown/>
              </span>
            </button>
            {isPickerOpen && (
              <div className="absolute left-0 mt-2 w-52 max-h-60 overflow-y-auto bg-white border border-slate-200 rounded-xl shadow-xl z-50 p-2 space-y-1">
                <div className="text-[10px] text-slate-400 px-2 py-1 font-semibold uppercase tracking-wider sticky top-0 bg-white">
                  {reportType==='daily'?'ជ្រើសរើសថ្ងៃ':'ជ្រើសរើសខែ និងឆ្នាំ'}
                </div>
                {options.map(item=>(
                  <button key={item} onClick={()=>handleSelect(item)}
                    className={`w-full text-left px-3 py-2 text-xs rounded-lg transition cursor-pointer ${currentVal===item?'bg-teal-700 text-white font-bold':'text-slate-700 hover:bg-slate-100'}`}>
                    {item}
                  </button>
                ))}
              </div>
            )}
          </div>
          <button onClick={handlePrintPOS}
            className="flex items-center gap-2 px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition shadow-sm cursor-pointer">
            <Icons.Printer/> បោះពុម្ព POS
          </button>
        </div>
      </div>

      {/* Stats cards */}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div className="bg-emerald-600 text-white rounded-2xl p-5 shadow-sm space-y-2 relative overflow-hidden">
          <div className="absolute right-0 top-0 translate-x-4 -translate-y-4 w-24 h-24 bg-emerald-500/30 rounded-full blur-xl pointer-events-none"></div>
          <p className="text-xs font-medium text-emerald-100">ប្រាក់ចំណូលទទួលបានសរុប</p>
          <div className="text-3xl font-extrabold tracking-tight">{formatMoney(totalRevenue)}</div>
          <div className="border-t border-emerald-500/50 pt-2 text-xs text-emerald-100">
            ប្រតិបត្តិការបង់ប្រាក់: {payments.length} លើក
          </div>
        </div>

        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-1">
          <p className="text-xs text-slate-500 font-medium">អ្នកជំងឺចុះឈ្មោះថ្មី</p>
          <div className="text-2xl font-bold text-slate-800">{newPats.length} នាក់</div>
          <p className="text-xs text-slate-400 pt-1">ថ្លៃសេវាបម្រើការ: {formatMoney(newServicesBilled)}</p>
        </div>

        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-1">
          <p className="text-xs text-slate-500 font-medium">
            ការណាត់ជួបក្នុង{reportType==='daily'?'ថ្ងៃ':'ខែ'}
          </p>
          <div className="text-2xl font-bold text-slate-800">{apps.length} ដង</div>
          <p className="text-xs text-slate-400 pt-1">ព្យាបាលរួចរាល់: {completedApps.length} ដង</p>
        </div>

        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-1">
          <p className="text-xs text-slate-500 font-medium">មធ្យមភាគចំណូល/ប្រតិបត្តិការ</p>
          <div className="text-2xl font-bold text-slate-800">{formatMoney(avgRevenue)}</div>
        </div>
      </div>

      {/* Payment table */}
      <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
        <div className="flex justify-between items-center border-b border-slate-100 pb-3 flex-wrap gap-2">
          <h3 className="font-bold text-slate-800 text-sm">
            ប្រវត្តិប្រមូលប្រាក់ ({payments.length} ប្រតិបត្តិការ)
          </h3>
          <span className="text-xs font-bold text-emerald-700">សរុប: {formatMoney(totalRevenue)}</span>
        </div>
        {payments.length===0 ? (
          <div className="text-center py-8 text-xs text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200">
            មិនមានទិន្នន័យសម្រាប់ {reportType==='daily'?selectedDate:selectedMonth}
          </div>
        ) : (
          <div className="overflow-x-auto">
            <table className="w-full text-left text-xs">
              <thead>
                <tr className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                  <th className="p-3 rounded-l-xl">កាលបរិច្ឆេទ</th>
                  <th className="p-3">ឈ្មោះអ្នកជំងឺ</th>
                  <th className="p-3">ទូរស័ព្ទ</th>
                  <th className="p-3">កត់ចំណាំ</th>
                  <th className="p-3 text-right rounded-r-xl">ទឹកប្រាក់</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {payments.map((pm,i)=>(
                  <tr key={i} className="hover:bg-slate-50/80">
                    <td className="p-3 font-semibold text-slate-700">{formatDate(pm.date)}</td>
                    <td className="p-3 font-bold text-slate-900">{pm.patientName}</td>
                    <td className="p-3 text-slate-500">{pm.patientPhone}</td>
                    <td className="p-3 text-slate-600">{pm.note||'បង់ប្រាក់'}</td>
                    <td className="p-3 text-right font-bold text-emerald-700">{formatMoney(pm.amount)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   MAIN APP (កូដទី១ + ភ្ជាប់ ReportsView)
   ============================================================ */
function App(){
  const [clinicInfo,setClinicInfo]=useState(()=>safeGetStorage('dental_clinic_info',INITIAL_CLINIC_INFO));
  const [presetServices,setPresetServices]=useState(()=>safeGetStorage('dental_preset_services',INITIAL_PRESET_SERVICES));
  const [patients,setPatients]=useState(()=>safeGetStorage('dental_patients_data',INITIAL_PATIENTS));

  const [currentView,setCurrentView]=useState("patients");
  const [searchTerm,setSearchTerm]=useState("");
  const [selectedPatientId,setSelectedPatientId]=useState(null);
  const [activeTab,setActiveTab]=useState("overview");
  const [selectedFilterDate,setSelectedFilterDate]=useState("");

  const [isRegisterOpen,setIsRegisterOpen]=useState(false);
  const [editingPatient,setEditingPatient]=useState(null);
  const [patientForm,setPatientForm]=useState({id:"",name:"",phone:"",gender:"ស្រី",age:"",services:[],deposit:"",firstAppDate:"",firstAppTime:"09:00",notes:""});
  const [paymentModal,setPaymentModal]=useState({open:false,patient:null,amount:"",note:""});
  const [newAppModal,setNewAppModal]=useState({open:false,patientId:"",date:getTodayIso(),time:"09:00",note:""});
  const [confirmDeleteModal,setConfirmDeleteModal]=useState({open:false,type:"",targetId:"",title:"",text:""});
  const [toastMessage,setToastMessage]=useState("");
  const [posPatientModal,setPosPatientModal]=useState(null);
  const [isServiceModalOpen,setIsServiceModalOpen]=useState(false);
  const [serviceForm,setServiceForm]=useState({name:"",price:""});
  const [editingService,setEditingService]=useState(null);
  const [isClinicModalOpen,setIsClinicModalOpen]=useState(false);

  useEffect(()=>{safeSetStorage('dental_clinic_info',clinicInfo);},[clinicInfo]);
  useEffect(()=>{safeSetStorage('dental_preset_services',presetServices);},[presetServices]);
  useEffect(()=>{safeSetStorage('dental_patients_data',patients);},[patients]);

  const showToast=(m)=>{setToastMessage(m);setTimeout(()=>setToastMessage(""),3000);};

  const openNewPatientModal=()=>{
    setEditingPatient(null);
    setPatientForm({id:"",name:"",phone:"",gender:"ស្រី",age:"",services:[{id:`s-${Date.now()}`,name:"",teeth:[],price:""}],deposit:"",firstAppDate:getTodayIso(),firstAppTime:"09:00",notes:""});
    setIsRegisterOpen(true);
  };
  const openEditPatientModal=(p)=>{
    setEditingPatient(p);
    setPatientForm({id:p.id,name:p.name,phone:p.phone,gender:p.gender,age:p.age||"",services:p.services&&p.services.length>0?p.services:[{id:`s-${Date.now()}`,name:"",teeth:[],price:""}],deposit:"",firstAppDate:"",firstAppTime:"09:00",notes:p.notes||""});
    setIsRegisterOpen(true);
  };

  const handleSavePatientSubmit=(e)=>{
    e.preventDefault();
    if(!patientForm.name||!patientForm.phone){showToast("សូមបញ្ចូលឈ្មោះ និងទូរស័ព្ទ!");return;}
    const dep=parseFloat(patientForm.deposit)||0;
    const fserv=patientForm.services.filter(s=>s.name.trim()!=="").map(s=>({id:s.id||`s-${Date.now()}-${Math.random()}`,name:s.name,teeth:s.teeth||[],price:parseFloat(s.price)||0}));
    if(editingPatient){
      setPatients(patients.map(p=>p.id===editingPatient.id?{...p,name:patientForm.name,phone:patientForm.phone,gender:patientForm.gender,age:parseInt(patientForm.age)||0,services:fserv,notes:patientForm.notes}:p));
      showToast("បានកែប្រែ!");
    } else {
      const nid=`P-${Math.floor(1000+Math.random()*9000)}`;
      const np={id:nid,name:patientForm.name,phone:patientForm.phone,gender:patientForm.gender,age:parseInt(patientForm.age)||0,services:fserv,createdAt:getTodayIso(),notes:patientForm.notes,appointments:patientForm.firstAppDate?[{id:`a-${Date.now()}`,date:patientForm.firstAppDate,time:patientForm.firstAppTime||"09:00",note:"ការណាត់ជួបលើកដំបូង",status:"កំពុងរង់ចាំ"}]:[],payments:dep>0?[{id:`p-${Date.now()}`,amount:dep,date:getTodayIso(),note:"ប្រាក់កក់ដំបូង"}]:[]};
      setPatients([np,...patients]);setSelectedPatientId(nid);showToast("បានចុះឈ្មោះ!");
    }
    setIsRegisterOpen(false);
  };

  const handleDeletePatient=(id)=>setConfirmDeleteModal({open:true,type:"PATIENT",targetId:id,title:"លុបទិន្នន័យអ្នកជំងឺ",text:"តើអ្នកពិតជាចង់លុបទិន្នន័យអ្នកជំងឺនេះមែនទេ?"});

  const confirmExecuteDelete=()=>{
    const {type,targetId}=confirmDeleteModal;
    if(type==="PATIENT"){
      const rem=patients.filter(p=>p.id!==targetId);
      setPatients(rem);
      if(selectedPatientId===targetId) setSelectedPatientId(rem.length>0?rem[0].id:null);
      showToast("បានលុបអ្នកជំងឺ!");
    } else if(type==="SERVICE"){
      setPresetServices(presetServices.filter(s=>s.id!==targetId));showToast("បានលុបសេវាកម្ម!");
    } else if(type==="PAYMENT"){
      setPatients(patients.map(p=>p.id===selectedPatientId?{...p,payments:p.payments.filter(pm=>pm.id!==targetId)}:p));showToast("បានលុបទូទាត់!");
    } else if(type==="APPOINTMENT"){
      setPatients(patients.map(p=>p.id===selectedPatientId?{...p,appointments:p.appointments.filter(a=>a.id!==targetId)}:p));showToast("បានលុបការណាត់ជួប!");
    }
    setConfirmDeleteModal({open:false,type:"",targetId:"",title:"",text:""});
  };

  const filteredPatients=useMemo(()=>patients.filter(p=>p.name.toLowerCase().includes(searchTerm.toLowerCase())||p.phone.includes(searchTerm)||p.id.toLowerCase().includes(searchTerm.toLowerCase())),[patients,searchTerm]);

  const handleAddPayment=()=>{
    if(!paymentModal.patient||!paymentModal.amount) return;
    const amt=parseFloat(paymentModal.amount);if(amt<=0) return;
    setPatients(patients.map(p=>p.id===paymentModal.patient.id?{...p,payments:[...p.payments,{id:`p-${Date.now()}`,amount:amt,date:getTodayIso(),note:paymentModal.note||"ការបង់ប្រាក់បន្ថែម"}]}:p));
    setPaymentModal({open:false,patient:null,amount:"",note:""});showToast("បានកត់ត្រាទូទាត់!");
  };

  const handleAddAppointment=()=>{
    if(!newAppModal.patientId) return;
    setPatients(patients.map(p=>p.id===newAppModal.patientId?{...p,appointments:[...p.appointments,{id:`a-${Date.now()}`,date:newAppModal.date,time:newAppModal.time,note:newAppModal.note||"ការណាត់ជួប",status:"កំពុងរង់ចាំ"}]}:p));
    setNewAppModal({open:false,patientId:"",date:getTodayIso(),time:"09:00",note:""});showToast("បានបន្ថែមការណាត់ជួប!");
  };

  const handleToggleAppointmentStatus=(pid,aid,st)=>{
    setPatients(patients.map(p=>p.id===pid?{...p,appointments:p.appointments.map(a=>a.id===aid?{...a,status:st}:a)}:p));
    showToast(`បានប្តូរទៅ៖ ${st}`);
  };

  const handleSaveServiceCatalog=(e)=>{
    e.preventDefault();
    if(!serviceForm.name||!serviceForm.price) return;
    if(editingService){
      setPresetServices(presetServices.map(s=>s.id===editingService.id?{...s,name:serviceForm.name,price:parseFloat(serviceForm.price)||0}:s));
      showToast("បានបច្ចុប្បន្នភាព!");
    } else {
      setPresetServices([...presetServices,{id:`cat-${Date.now()}`,name:serviceForm.name,price:parseFloat(serviceForm.price)||0}]);
      showToast("បានបន្ថែមសេវាកម្មថ្មី!");
    }
    setIsServiceModalOpen(false);setServiceForm({name:"",price:""});setEditingService(null);
  };

  return (
    <div className="min-h-screen flex flex-col">
      {/* HEADER */}
      <header className="bg-teal-700 text-white shadow-md sticky top-0 z-30 no-print">
        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center font-bold text-teal-200 border border-white/20">
              <Icons.Tooth/>
            </div>
            <div>
              <h1 className="font-bold text-lg leading-snug">{clinicInfo.name}</h1>
              <p className="text-xs text-teal-200">{clinicInfo.subtitle}</p>
            </div>
          </div>
          <div className="flex items-center gap-2 flex-wrap">
            <button onClick={()=>setCurrentView("patients")} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition cursor-pointer ${currentView==='patients'?'bg-white text-teal-800 shadow-sm':'hover:bg-teal-600 text-teal-100'}`}>
              អ្នកជំងឺទាំងអស់
            </button>
            <button onClick={()=>setCurrentView("appointments")} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer ${currentView==='appointments'?'bg-white text-teal-800 shadow-sm':'hover:bg-teal-600 text-teal-100'}`}>
              <Icons.Calendar/> តារាងណាត់ជួប
            </button>
            <button onClick={()=>setCurrentView("services")} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition cursor-pointer ${currentView==='services'?'bg-white text-teal-800 shadow-sm':'hover:bg-teal-600 text-teal-100'}`}>
              សេវាកម្ម និងតម្លៃ
            </button>
            <button onClick={()=>setCurrentView("reports")} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 cursor-pointer ${currentView==='reports'?'bg-white text-teal-800 shadow-sm':'hover:bg-teal-600 text-teal-100'}`}>
              <Icons.Chart/> របាយការណ៍
            </button>
            <button onClick={()=>setIsClinicModalOpen(true)} className="p-2.5 rounded-xl hover:bg-teal-600 text-teal-100 transition cursor-pointer" title="ការកំណត់">
              <Icons.Settings/>
            </button>
          </div>
        </div>
      </header>

      {toastMessage && (
        <div className="fixed bottom-5 right-5 z-50 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl text-xs font-medium border border-slate-700 flex items-center gap-2 no-print">
          <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
          {toastMessage}
        </div>
      )}

      <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 no-print">
        {/* ============ PATIENTS VIEW ============ */}
        {currentView==="patients" && (
          <div className="space-y-4">
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
              <div className="flex items-center justify-between gap-2">
                <h2 className="font-bold text-slate-800 text-base">បញ្ជីអ្នកជំងឺ ({filteredPatients.length})</h2>
                <button onClick={openNewPatientModal} className="bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-sm transition flex items-center gap-1.5 cursor-pointer">
                  <Icons.Plus/> អ្នកជំងឺថ្មី
                </button>
              </div>
              <div className="relative w-full sm:w-80">
                <input type="text" placeholder="ស្វែងរក..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}
                  className="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-teal-500"/>
                <div className="absolute left-3 top-2.5 text-slate-400"><Icons.Search/></div>
              </div>
            </div>

            <div className="space-y-3">
              {filteredPatients.length===0 ? (
                <div className="bg-white p-8 rounded-2xl text-center text-slate-400 border border-dashed border-slate-200 text-xs">
                  មិនមានទិន្នន័យអ្នកជំងឺ
                </div>
              ) : filteredPatients.map(p=>{
                const tc=p.services.reduce((a,c)=>a+c.price,0);
                const tp=p.payments.reduce((a,c)=>a+c.amount,0);
                const bal=tc-tp;
                const isSel=selectedPatientId===p.id;
                return (
                  <div key={p.id} className={`bg-white rounded-2xl border transition-all overflow-hidden ${isSel?'border-teal-500 shadow-md ring-2 ring-teal-500/20':'border-slate-200 hover:border-teal-300 shadow-sm'}`}>
                    <div onClick={()=>setSelectedPatientId(isSel?null:p.id)}
                      className={`p-4 transition cursor-pointer flex flex-col gap-2 ${isSel?'bg-teal-50/90 border-b border-teal-100':'hover:bg-slate-50/80'}`}>
                      <div className="flex items-start justify-between">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-slate-900 text-base">{p.name}</span>
                            <span className="text-[10px] bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded-full font-mono">{p.id}</span>
                            {isSel && <span className="text-[10px] bg-teal-600 text-white font-bold px-2 py-0.5 rounded-full">កំពុងមើល</span>}
                          </div>
                          <p className="text-xs text-slate-500 mt-1">
                            ទូរស័ព្ទ: <span className="font-semibold text-slate-700">{p.phone}</span> • ភេទ: {p.gender} ({p.age} ឆ្នាំ)
                          </p>
                        </div>
                        <span className={`text-[11px] font-bold px-2.5 py-1 rounded-full ${bal<=0?'bg-emerald-100 text-emerald-800':'bg-amber-100 text-amber-800'}`}>
                          {bal<=0?'បង់រួច':`ជំពាក់: ${formatMoney(bal)}`}
                        </span>
                      </div>
                      <div className="flex items-center justify-between text-[11px] text-slate-500 border-t border-slate-200/60 pt-2 mt-1">
                        <span>សេវា: {p.services.length} ប្រភេទ</span>
                        <div className="flex items-center gap-2">
                          <span className="font-medium text-slate-700">សរុប: {formatMoney(tc)}</span>
                          <span className="text-teal-700 font-bold text-xs">{isSel?'▲ បិទ':'▼ លម្អិត'}</span>
                        </div>
                      </div>
                    </div>

                    {isSel && (
                      <div className="p-4 sm:p-5 bg-white space-y-4 animate-fadeIn">
                        <div className="flex flex-wrap items-center justify-between gap-2 p-3 bg-slate-50 rounded-xl border border-slate-200/70">
                          <div className="text-xs font-semibold text-slate-700">
                            ចុះឈ្មោះ: <span className="font-bold text-slate-900">{formatDate(p.createdAt)}</span>
                          </div>
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <button onClick={e=>{e.stopPropagation();openEditPatientModal(p);}} className="p-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 cursor-pointer shadow-xs" title="កែ"><Icons.Edit/></button>
