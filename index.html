    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Format Currency (USD helper)
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);
        };

        // Format Date to Khmer localized display
        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('km-KH', { year: 'numeric', month: 'short', day: 'numeric' });
        };

        // Get today's ISO date string (YYYY-MM-DD)
        const getTodayIso = () => new Date().toISOString().split('T')[0];

        // Default Clinic Information Configuration
        const INITIAL_CLINIC_INFO = {

        // Initial sample patients data

                appointments: [

                    { id: "a4", date: getTodayIso(), time: "11:00", note: "សារ៉េដែកពត់ធ្មេញប្រចាំខែ", status: "កំពុងរង់ចាំ" }

        // Reusable Tooth Selector Box with EXACTLY TWO ROWS & HORIZONTAL SCROLL
        function ToothSelector({ selectedTeeth = [], onToggleTooth, label }) {
            return (
                <div class="space-y-1">
                    {label && <label class="block text-[11px] font-semibold text-slate-600 mb-1">{label}</label>}
                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm overflow-x-auto max-w-full">
                        <div class="min-w-max flex flex-col items-center gap-2">
                            {/* Row 1: Upper Jaw (18 - 11 | 21 - 28) */}
                            <div class="flex items-center gap-1 flex-nowrap">
                                <span class="text-[10px] font-bold text-slate-400 mr-1 w-8 text-right">លើ:</span>
                                <div class="flex items-center gap-1">
                                    {UPPER_TEETH_RIGHT.map(t => {
                                        const isSelected = selectedTeeth.includes(t);
                                        return (
                                            <button 
                                                type="button" 
                                                key={t}
                                                onClick={() => onToggleTooth(t)}
                                                class={`w-8 h-8 rounded-lg text-xs font-bold transition flex items-center justify-center border cursor-pointer ${
                                                    isSelected 
                                                        ? 'bg-teal-600 text-white border-teal-700 shadow-sm scale-105' 
                                                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-teal-400 hover:bg-teal-50'
                                                }`}>
                                                {t}
                                            </button>
                                        );
                                    })}
                                </div>
                                <div class="w-px h-6 bg-slate-300 mx-1.5"></div>
                                <div class="flex items-center gap-1">
                                    {UPPER_TEETH_LEFT.map(t => {
                                        const isSelected = selectedTeeth.includes(t);
                                        return (
                                            <button 
                                                type="button" 
                                                key={t}
                                                onClick={() => onToggleTooth(t)}
                                                class={`w-8 h-8 rounded-lg text-xs font-bold transition flex items-center justify-center border cursor-pointer ${
                                                    isSelected 
                                                        ? 'bg-teal-600 text-white border-teal-700 shadow-sm scale-105' 
                                                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-teal-400 hover:bg-teal-50'
                                                }`}>
                                                {t}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Divider line between Upper & Lower Teeth */}
                            <div class="w-full border-t border-slate-200 my-0.5"></div>

                            {/* Row 2: Lower Jaw (48 - 41 | 31 - 38) */}
                            <div class="flex items-center gap-1 flex-nowrap">
                                <span class="text-[10px] font-bold text-slate-400 mr-1 w-8 text-right">ក្រោម:</span>
                                <div class="flex items-center gap-1">
                                    {LOWER_TEETH_RIGHT.map(t => {
                                        const isSelected = selectedTeeth.includes(t);
                                        return (
                                            <button 
                                                type="button" 
                                                key={t}
                                                onClick={() => onToggleTooth(t)}
                                                class={`w-8 h-8 rounded-lg text-xs font-bold transition flex items-center justify-center border cursor-pointer ${
                                                    isSelected 
                                                        ? 'bg-teal-600 text-white border-teal-700 shadow-sm scale-105' 
                                                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-teal-400 hover:bg-teal-50'

                                </div>
                                <div class="w-px h-6 bg-slate-300 mx-1.5"></div>
                                <div class="flex items-center gap-1">
                                    {LOWER_TEETH_LEFT.map(t => {
                                        const isSelected = selectedTeeth.includes(t);
                                        return (
                                            <button 
                                                type="button" 
                                                key={t}
                                                onClick={() => onToggleTooth(t)}
                                                class={`w-8 h-8 rounded-lg text-xs font-bold transition flex items-center justify-center border cursor-pointer ${
                                                    isSelected 
                                                        ? 'bg-teal-600 text-white border-teal-700 shadow-sm scale-105' 
                                                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:border-teal-400 hover:bg-teal-50'

                    </div>
                    <p class="text-[11px] text-teal-700 mt-1 font-semibold">
                        ធ្មេញជ្រើសរើស: {selectedTeeth.length > 0 ? selectedTeeth.slice().sort((a,b)=>a-b).join(', ') : 'គ្មាន (ជ្រើសរើសទាំងអស់ ឬ ទូទៅ)'}

        }

        function App() {
            // Clinic Information State
            const [clinicInfo, setClinicInfo] = useState(() => {
                const savedInfo = localStorage.getItem('dental_clinic_info');
                return savedInfo ? JSON.parse(savedInfo) : INITIAL_CLINIC_INFO;
            });

            // Service Catalog / Preset Services State
            const [presetServices, setPresetServices] = useState(() => {
                const saved = localStorage.getItem('dental_preset_services');
                return saved ? JSON.parse(saved) : INITIAL_PRESET_SERVICES;
            });

            // Patients List State
            const [patients, setPatients] = useState(() => {
                const saved = localStorage.getItem('dental_patients_data');
                return saved ? JSON.parse(saved) : INITIAL_PATIENTS;
            });

            // Navigation State: 'patients' or 'appointments'
            const [currentView, setCurrentView] = useState("patients");

            const [searchTerm, setSearchTerm] = useState("");
            const [filterStatus, setFilterStatus] = useState("all");
            const [dateFilterMode, setDateFilterMode] = useState("all");
            const [filterDate, setFilterDate] = useState(getTodayIso());
            
            // Selected Patient Modal / Form Drawer State
            const [selectedPatient, setSelectedPatient] = useState(null);
            const [posPatient, setPosPatient] = useState(null);
            const [isRegisterOpen, setIsRegisterOpen] = useState(false);
            const [isQuickAppOpen, setIsQuickAppOpen] = useState(false);
            const [isClinicModalOpen, setIsClinicModalOpen] = useState(false);
            const [isManageServicesOpen, setIsManageServicesOpen] = useState(false);
            const [activeTab, setActiveTab] = useState("overview");
            
            const [toastMessage, setToastMessage] = useState("");
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);

            const [newPatient, setNewPatient] = useState({
                name: "",
                phone: "",
                gender: "ស្រី",
                age: "",
                services: [
                    { id: `s-${Date.now()}-1`, name: "", teeth: [], price: "" }
                ],
                deposit: "",
                firstAppDate: getTodayIso(),
                firstAppTime: "09:00",
                notes: ""
            });

            const [quickApp, setQuickApp] = useState({
                patientId: "",
                date: getTodayIso(),
                time: "10:00",
                note: ""
            });

            useEffect(() => {
                localStorage.setItem('dental_clinic_info', JSON.stringify(clinicInfo));
            }, [clinicInfo]);

            useEffect(() => {
                localStorage.setItem('dental_preset_services', JSON.stringify(presetServices));
            }, [presetServices]);

            useEffect(() => {
                localStorage.setItem('dental_patients_data', JSON.stringify(patients));
            }, [patients]);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(""), 3500);
            };

            const handleSaveClinicInfo = (updatedInfo) => {
                setClinicInfo(updatedInfo);
                setIsClinicModalOpen(false);
                showToast("បានកែប្រែព័ត៌មានគ្លីនិកជោគជ័យ!");
            };

            const getPatientTotals = (p) => {
                if (!p) return { totalCost: 0, totalPaid: 0, remaining: 0 };
                const totalPaid = p.payments ? p.payments.reduce((sum, item) => sum + Number(item.amount || 0), 0) : 0;
                
                let totalCost = 0;
                if (p.services && p.services.length > 0) {
                    totalCost = p.services.reduce((sum, s) => sum + Number(s.price || 0), 0);
                } else {
                    totalCost = Number(p.totalCost || 0);
                }

                const remaining = totalCost - totalPaid;
                return { totalCost, totalPaid, remaining: remaining > 0 ? remaining : 0 };
            };

            const masterAppointments = useMemo(() => {
                const list = [];
                patients.forEach(p => {
                    if (p.appointments) {
                        p.appointments.forEach(app => {
                            list.push({
                                ...app,
                                patientId: p.id,
                                patientName: p.name,
                                patientPhone: p.phone,
                                patientGender: p.gender,
                                patientAge: p.age,
                                fullPatient: p
                            });
                        });
                    }
                });
                return list.sort((a, b) => new Date(`${a.date}T${a.time || '00:00'}`) - new Date(`${b.date}T${b.time || '00:00'}`));
            }, [patients]);

            const filteredPatients = useMemo(() => {
                return patients.filter(p => {
                    const matchSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                        p.phone.includes(searchTerm) || 
                                        p.id.toLowerCase().includes(searchTerm.toLowerCase());
                    
                    const { remaining } = getPatientTotals(p);
                    let matchStatus = true;
                    if (filterStatus === "owing") matchStatus = remaining > 0;
                    if (filterStatus === "paid") matchStatus = remaining <= 0;

                    let matchDate = true;
                    if (dateFilterMode === "today") {
                        matchDate = p.createdAt === filterDate;
                    } else if (dateFilterMode === "month") {
                        const patientMonth = p.createdAt ? p.createdAt.substring(0, 7) : "";
                        const currentMonth = filterDate.substring(0, 7);
                        matchDate = patientMonth === currentMonth;
                    }

                    return matchSearch && matchStatus && matchDate;
                });
            }, [patients, searchTerm, filterStatus, dateFilterMode, filterDate]);

            const stats = useMemo(() => {
                let totalPatients = filteredPatients.length;
                let grandTotalCost = 0;
                let grandTotalPaid = 0;
                let grandTotalDue = 0;
                let todayCollected = 0;

                filteredPatients.forEach(p => {
                    const { totalCost, totalPaid, remaining } = getPatientTotals(p);
                    grandTotalCost += totalCost;
                    grandTotalPaid += totalPaid;
                    grandTotalDue += remaining;

                    if (p.payments) {
                        p.payments.forEach(pay => {
                            if (pay.date === filterDate) {
                                todayCollected += Number(pay.amount || 0);
                            }
                        });
                    }
                });

                const todayAppointmentsCount = masterAppointments.filter(a => a.date === getTodayIso()).length;

                return { totalPatients, grandTotalCost, grandTotalPaid, grandTotalDue, todayCollected, todayAppointmentsCount };
            }, [filteredPatients, filterDate, masterAppointments]);

            const handleAddServiceRow = () => {
                setNewPatient(prev => ({
                    ...prev,
                    services: [
                        ...prev.services,
                        { id: `s-${Date.now()}-${prev.services.length + 1}`, name: "", teeth: [], price: "" }
                    ]
                }));
            };

            const handleRemoveServiceRow = (index) => {
                if (newPatient.services.length <= 1) return;
                setNewPatient(prev => ({
                    ...prev,
                    services: prev.services.filter((_, i) => i !== index)
                }));
            };

            const handleServiceFieldChange = (index, field, value) => {
                setNewPatient(prev => {
                    const updated = [...prev.services];
                    updated[index] = { ...updated[index], [field]: value };
                    return { ...prev, services: updated };
                });
            };

            const handleSelectPresetForNewPatient = (index, presetId) => {
                const found = presetServices.find(s => s.id === presetId);
                if (found) {
                    setNewPatient(prev => {
                        const updated = [...prev.services];
                        updated[index] = {
                            ...updated[index],
                            name: found.name,
                            price: found.price
                        };
                        return { ...prev, services: updated };
                    });
                }
            };

            const toggleToothForService = (serviceIndex, toothNum) => {
                setNewPatient(prev => {
                    const updatedServices = [...prev.services];
                    const currentTeeth = updatedServices[serviceIndex].teeth || [];
                    const exists = currentTeeth.includes(toothNum);
                    const newTeeth = exists 
                        ? currentTeeth.filter(t => t !== toothNum) 
                        : [...currentTeeth, toothNum];

                    updatedServices[serviceIndex] = {
                        ...updatedServices[serviceIndex],
                        teeth: newTeeth
                    };
                    return { ...prev, services: updatedServices };
                });
            };

            const liveTotalCost = useMemo(() => {
                return newPatient.services.reduce((sum, s) => sum + Number(s.price || 0), 0);
            }, [newPatient.services]);

            const handleAddPatient = (e) => {
                e.preventDefault();
                if (!newPatient.name || !newPatient.phone) {
                    showToast("សូមបញ្ចូល ឈ្មោះ និង លេខទូរស័ព្ទ!");
                    return;
                }

                if (liveTotalCost <= 0) {
                    showToast("សូមបញ្ចូលឈ្មោះសេវាកម្ម និង តម្លៃសេវាកម្មយ៉ាងហោចណាស់មួយ!");
                    return;
                }

                const initialDeposit = Number(newPatient.deposit || 0);
                const createdDate = getTodayIso();
                const patientId = `P-${1000 + patients.length + 1}`;

                const patientObj = {
                    id: patientId,
                    name: newPatient.name,
                    phone: newPatient.phone,
                    gender: newPatient.gender,
                    age: newPatient.age || 0,
                    services: newPatient.services.map(s => ({
                        id: s.id || `s-${Date.now()}`,
                        name: s.name || "សេវាកម្មទូទៅ",
                        teeth: s.teeth || [],
                        price: Number(s.price || 0)
                    })),
                    createdAt: createdDate,

                            date: createdDate,

                            ...serviceData

                        const updatedPatient = { ...p, services: updatedServices };
                        if (selectedPatient && selectedPatient.id === patientId) {
                            setSelectedPatient(updatedPatient);
                        }
                        return updatedPatient;
                    }
                    return p;

                        const updatedPatient = { ...p, appointments: updatedApps };

            };

            const handleToggleAppointmentStatus = (patientId, appId) => {

                        const updatedPatient = { ...p, appointments: updatedApps };

                        }
                        return updatedPatient;
                    }
                    return p;
                }));

                        const updatedPatient = { ...p, appointments: updatedApps };
                        if (selectedPatient && selectedPatient.id === patientId) {
                            setSelectedPatient(updatedPatient);
                        }
                        return updatedPatient;
                    }
                    return p;
                }));
                showToast("បានលុបការណាត់ជួបជោគជ័យ!");
            };

            const [statusFilter, setStatusFilter] = useState("all");
            const [searchTerm, setSearchTerm] = useState("");

            const filteredApps = useMemo(() => {
                return appointments.filter(app => {
                    let matchDate = true;
                    if (filterDateMode === "today") {
                        matchDate = app.date === getTodayIso();
                    } else if (filterDateMode === "custom") {
                        matchDate = app.date === customDate;
                    }

                    let matchStatus = true;
                    if (statusFilter === "pending") matchStatus = app.status === "កំពុងរង់ចាំ";
                    if (statusFilter === "completed") matchStatus = app.status === "រួចរាល់";

                    let matchSearch = true;
                    if (searchTerm) {
                        const term = searchTerm.toLowerCase();
                        matchSearch = app.patientName.toLowerCase().includes(term) ||
                                      app.patientPhone.includes(term) ||
                                      (app.note && app.note.toLowerCase().includes(term));
                    }

                    return matchDate && matchStatus && matchSearch;
                });
            }, [appointments, filterDateMode, customDate, statusFilter, searchTerm]);

            const todayCount = appointments.filter(a => a.date === getTodayIso()).length;
            const pendingCount = appointments.filter(a => a.status === "កំពុងរង់ចាំ").length;

                                class={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${filterDateMode === 'all' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>
                                ទាំងអស់
                            </button>
                            <button 
                                onClick={() => setFilterDateMode("custom")}
                                class={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${filterDateMode === 'custom' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>
                                ជ្រើសរើសថ្ងៃ
                            </button>
                        </div>

                        {filterDateMode === 'custom' && (
                            <input 
                                type="date"
                                value={customDate}
                                onChange={(e) => setCustomDate(e.target.value)}
                                class="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-teal-500"
                            />
                        )}

                        <select 
                            value={statusFilter}
                            onChange={(e) => setStatusFilter(e.target.value)}
                            class="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-teal-500 font-medium">
                            <option value="all">ស្ថានភាពទាំងអស់</option>
                            <option value="pending">កំពុងរង់ចាំ</option>
                            <option value="completed">រួចរាល់</option>
                        </select>

                        <button 
                            onClick={onOpenQuickAppModal}
                            class="bg-teal-700 hover:bg-teal-800 text-white font-bold px-4 py-2.5 rounded-xl shadow transition flex items-center gap-1.5 text-xs whitespace-nowrap">
                            <i data-lucide="plus-circle" class="w-4 h-4"></i>
                            <span>+ បន្ថែមការណាត់ជួប</span>
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                            <h2 class="font-bold text-slate-800 text-base flex items-center gap-2">
                                <i data-lucide="calendar-days" class="w-5 h-5 text-teal-600"></i>
                                បញ្ជីការណាត់ជួបទាំងអស់ ({filteredApps.length})
                            </h2>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-500 text-xs font-semibold uppercase border-b border-slate-100">
                                        <th class="py-3.5 px-4">ថ្ងៃណាត់ជួប / ម៉ោង</th>
                                        <th class="py-3.5 px-4">អ្នកជំងឺ</th>
                                        <th class="py-3.5 px-4">បរិយាយ / កំណត់សម្គាល់</th>
                                        <th class="py-3.5 px-4">ស្ថានភាព</th>
                                        <th class="py-3.5 px-4 text-center">សកម្មភាព</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    {filteredApps.length === 0 ? (
                                        <tr>
                                            <td colSpan="5" class="py-12 text-center text-slate-400">
                                                <i data-lucide="calendar-x" class="w-12 h-12 mx-auto mb-2 opacity-40"></i>
                                                <p class="font-medium text-slate-600">គ្មានការណាត់ជួបឡើយ</p>
                                            </td>
                                        </tr>
                                    ) : (
                                        filteredApps.map(app => (
                                            <tr key={app.id} class="hover:bg-slate-50 transition">
                                                <td class="py-3.5 px-4">
                                                    <div class="font-bold text-slate-800">{formatDate(app.date)}</div>
                                                    <div class="text-xs text-teal-700 font-semibold flex items-center gap-1 mt-0.5">
                                                        <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                                                        ម៉ោង {app.time || '09:00'}
                                                    </div>
                                                </td>
                                                <td class="py-3.5 px-4">
                                                    <div class="font-bold text-slate-800">{app.patientName}</div>
                                                    <div class="text-xs text-slate-500">{app.patientId} • {app.patientPhone}</div>
                                                </td>
                                                <td class="py-3.5 px-4 max-w-xs text-slate-700 text-xs font-medium">
                                                    {app.note || "ការណាត់ជួបពិនិត្យតាមដាន"}
                                                </td>
                                                <td class="py-3.5 px-4">
                                                    <button 
                                                        onClick={() => onToggleStatus(app.patientId, app.id)}
                                                        class={`px-3 py-1 rounded-full text-xs font-bold transition flex items-center gap-1.5 ${
                                                            app.status === 'រួចរាល់' 
                                                                ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200' 
                                                                : 'bg-amber-100 text-amber-800 hover:bg-amber-200'
                                                        }`}>
                                                        <i data-lucide={app.status === 'រួចរាល់' ? 'check-circle-2' : 'clock'} class="w-3.5 h-3.5"></i>
                                                        <span>{app.status}</span>
                                                    </button>
                                                </td>
                                                <td class="py-3.5 px-4 text-center">
                                                    <div class="flex items-center justify-center gap-2">
                                                        <button 
                                                            onClick={() => onOpenPatientDetail(app.fullPatient)}
                                                            class="px-2.5 py-1.5 bg-teal-50 text-teal-700 hover:bg-teal-100 rounded-lg text-xs font-bold">
                                                            មើលអ្នកជំងឺ
                                                        </button>
                                                        <button 
                                                            onClick={() => onDeleteAppointment(app.patientId, app.id)}
                                                            class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg">
                                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }
function PatientDetailModal({ 
            patient, onClose, activeTab, setActiveTab, 
            onAddAppointment, onToggleAppointmentStatus, onAddPayment, onAddService, 
            onRemoveService,
            getPatientTotals, onOpenPosReceipt, presetServices, setIsManageServicesOpen, showToast 
        }) {
            const { totalCost, totalPaid, remaining } = getPatientTotals(patient);

            const [newService, setNewService] = useState({ name: "", teeth: [], price: "" });
            const [newPay, setNewPay] = useState({ amount: "", note: "", date: getTodayIso() });
            const [newApp, setNewApp] = useState({ date: getTodayIso(), time: "10:00", note: "" });

            const handleToggleServiceTooth = (t) => {
                const currentTeeth = newService.teeth || [];
                if (currentTeeth.includes(t)) {
                    setNewService({ ...newService, teeth: currentTeeth.filter(x => x !== t) });
                } else {
                    setNewService({ ...newService, teeth: [...currentTeeth, t] });
                }
            };

            const handleSelectPresetService = (presetId) => {
                const found = presetServices.find(s => s.id === presetId);
                if (found) {
                    setNewService(prev => ({
                        ...prev,
                        name: found.name,
                        price: found.price
                    }));
                }
            };

            const submitAddService = (e) => {
                e.preventDefault();
                if (!newService.name || !newService.price) {
                    showToast("សូមបញ្ចូលឈ្មោះសេវាកម្ម និង តម្លៃ!");
                    return;
                }
                onAddService(patient.id, {
                    name: newService.name,
                    teeth: newService.teeth,
                    price: Number(newService.price)
                });
                setNewService({ name: "", teeth: [], price: "" });
            };

            const submitAddPayment = (e) => {
                e.preventDefault();
                if (!newPay.amount || Number(newPay.amount) <= 0) {
                    showToast("សូមបញ្ចូលចំនួនប្រាក់បង់ត្រឹមត្រូវ!");
                    return;
                }
                onAddPayment(patient.id, {
                    amount: Number(newPay.amount),
                    date: newPay.date,
                    note: newPay.note || "ប្រាក់កក់បន្ថែម"
                });
                setNewPay({ amount: "", note: "", date: getTodayIso() });
            };

            const submitAddAppointment = (e) => {
                e.preventDefault();
                if (!newApp.date) {
                    showToast("សូមជ្រើសរើសថ្ងៃណាត់ជួប!");
                    return;
                }
                onAddAppointment(patient.id, {
                    date: newApp.date,
                    time: newApp.time,
                    note: newApp.note
                });
                setNewApp({ date: getTodayIso(), time: "10:00", note: "" });
            };

            return (
                <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto no-print">
                    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl my-8 overflow-hidden flex flex-col max-h-[92vh]">
                        {/* Modal Header */}
                        <div class="bg-teal-700 px-6 py-4 text-white flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-teal-600 font-bold flex items-center justify-center text-teal-100 text-sm">
                                    {patient.gender === 'ស្រី' ? 'Ms' : 'Mr'}
                                </div>
                                <div>
                                    <h3 class="text-lg font-bold flex items-center gap-2">
                                        <span>{patient.name}</span>
                                        <span class="text-xs bg-teal-600/80 px-2.5 py-0.5 rounded-full border border-teal-500/50">{patient.id}</span>
                                    </h3>
                                    <p class="text-xs text-teal-200">ទូរស័ព្ទ: {patient.phone} • {patient.gender} ({patient.age} ឆ្នាំ)</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button 
                                    onClick={() => onOpenPosReceipt(patient)}
                                    class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow transition">
                                    <i data-lucide="printer" class="w-4 h-4"></i>
                                    <span>បោះពុម្ពវិក្កយបត្រ POS</span>
                                </button>
                                <button onClick={onClose} class="text-teal-200 hover:text-white p-1">
                                    <i data-lucide="x" class="w-6 h-6"></i>
                                </button>
                            </div>
                        </div>

                        {/* Patient Summary Financial Ribbon */}
                        <div class="bg-slate-100 px-6 py-3 border-b border-slate-200 grid grid-cols-3 text-center">
                            <div>
                                <p class="text-[11px] text-slate-500 font-semibold uppercase">តម្លៃសរុប</p>
                                <p class="text-base font-extrabold text-blue-600">{formatMoney(totalCost)}</p>
                            </div>
                            <div class="border-x border-slate-200">
                                <p class="text-[11px] text-slate-500 font-semibold uppercase">បានបង់/កក់សរុប</p>
                                <p class="text-base font-extrabold text-emerald-600">{formatMoney(totalPaid)}</p>
                            </div>
                            <div>
                                <p class="text-[11px] text-slate-500 font-semibold uppercase">ប្រាក់ខ្វះ (នៅសល់)</p>
                                <p className={`text-base font-extrabold ${remaining > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                                    {remaining > 0 ? formatMoney(remaining) : 'គ្រប់ចំនួន'}
                                </p>
                            </div>
                        </div>

                        {/* Tab Bar */}
                        <div class="flex border-b border-slate-200 bg-white px-6 pt-2">
                            <button 
                                onClick={() => setActiveTab("overview")}
                                class={`px-4 py-2.5 font-bold text-xs border-b-2 transition flex items-center gap-2 ${activeTab === 'overview' ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>
                                <i data-lucide="file-text" class="w-4 h-4"></i>
                                ព័ត៌មានព្យាបាល & សេវាកម្ម
                            </button>
                            <button 
                                onClick={() => setActiveTab("appointments")}
                                class={`px-4 py-2.5 font-bold text-xs border-b-2 transition flex items-center gap-2 ${activeTab === 'appointments' ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>
                                <i data-lucide="calendar" class="w-4 h-4"></i>
                                កាលវិភាគណាត់ជួប ({patient.appointments ? patient.appointments.length : 0})
                            </button>
                            <button 
                                onClick={() => setActiveTab("payments")}
                                class={`px-4 py-2.5 font-bold text-xs border-b-2 transition flex items-center gap-2 ${activeTab === 'payments' ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-800'}`}>
                                <i data-lucide="receipt" class="w-4 h-4"></i>
                                ប្រវត្តិការបង់ប្រាក់ ({patient.payments ? patient.payments.length : 0})
                            </button>
                        </div>

                        {/* Modal Body */}
                        <div class="p-6 overflow-y-auto space-y-6 flex-grow">
                            
                            {/* TAB 1: OVERVIEW & SERVICES */}
                            {activeTab === 'overview' && (
                                <div class="space-y-6">
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs">
                                        <div>
                                            <p class="text-slate-500">ថ្ងៃចុះឈ្មោះដំបូង: <span class="font-bold text-slate-800">{formatDate(patient.createdAt)}</span></p>
                                            <p class="text-slate-500 mt-1">កំណត់សម្គាល់/រោគវិនិច្ឆ័យ: <span class="font-bold text-slate-800">{patient.notes || 'គ្មាន'}</span></p>
                                        </div>
                                        <div>
                                            <p class="text-slate-500">លេខទូរស័ព្ទ: <span class="font-bold text-slate-800">{patient.phone}</span></p>
                                            <p class="text-slate-500 mt-1">ភេទ / អាយុ: <span class="font-bold text-slate-800">{patient.gender} • {patient.age} ឆ្នាំ</span></p>
                                        </div>
                                    </div>

                                    {/* Existing Services List */}
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                                            <i data-lucide="layers" class="w-4 h-4 text-teal-600"></i>
                                            បញ្ជីសេវាកម្មព្យាបាលដែលបានជ្រើសរើស
                                        </h4>
                                        <div class="border border-slate-200 rounded-xl overflow-hidden">
                                            <table class="w-full text-left text-xs border-collapse">
                                                <thead>
                                                    <tr class="bg-slate-50 text-slate-500 font-semibold uppercase border-b border-slate-200">
                                                        <th class="py-2.5 px-4">សេវាកម្ម</th>
                                                        <th class="py-2.5 px-4">លេខធ្មេញ</th>
                                                        <th class="py-2.5 px-4 text-right">តម្លៃ (USD)</th>
                                                        <th class="py-2.5 px-4 text-center">សកម្មភាព</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-slate-100">
                                                    {patient.services && patient.services.length > 0 ? (
                                                        patient.services.map(s => (
                                                            <tr key={s.id} class="hover:bg-slate-50">
                                                                <td class="py-3 px-4 font-bold text-slate-800">{s.name}</td>
                                                                <td class="py-3 px-4 font-semibold text-teal-700">
                                                                    {s.teeth && s.teeth.length > 0 ? s.teeth.map(t => `#${t}`).join(', ') : 'ធ្មេញទាំងអស់'}
                                                                </td>
                                                                <td class="py-3 px-4 text-right font-extrabold text-blue-600">{formatMoney(s.price)}</td>
                                                                <td class="py-3 px-4 text-center">
                                                                    <button
                                                                        onClick={() => onRemoveService(patient.id, s.id)}
                                                                        class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                                                                        title="លុបសេវាកម្មនេះ"
                                                                    >
                                                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))
                                                    ) : (
                                                        <tr>
                                                            <td colSpan="4" class="py-6 text-center text-slate-400">
                                                                មិនទាន់មានសេវាកម្មក្នុងវិក្កយបត្រនេះឡើយ
                                                            </td>
                                                        </tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    {/* Form: Add New Service to Patient */}
                                    <form onSubmit={submitAddService} class="bg-teal-50/70 p-4 rounded-2xl border border-teal-200 space-y-4">
                                        <div class="flex justify-between items-center">
                                            <h4 class="text-xs font-bold text-teal-800 uppercase tracking-wider flex items-center gap-1.5">
                                                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                                                បន្ថែមសេវាកម្មថ្មីចូលក្នុងវិក្កយបត្រនេះ
                                            </h4>
                                            <button 
                                                type="button" 
                                                onClick={() => setIsManageServicesOpen(true)}
                                                class="text-xs text-amber-700 hover:text-amber-800 font-bold flex items-center gap-1">
                                                <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                                                គ្រប់គ្រងកាតាឡុកសេវាកម្ម
                                            </button>
                                        </div>

                                        <div>
                                            <label class="block text-xs font-semibold text-teal-800 mb-1">ជ្រើសរើសពីសេវាកម្មដែលមានស្រាប់ (Preset):</label>
                                            <select 
                                                onChange={(e) => handleSelectPresetService(e.target.value)}
                                                class="w-full border border-teal-300 rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-teal-500 bg-white">
                                                <option value="">-- ចុចជ្រើសរើសសេវាកម្មពីកាតាឡុក --</option>
                                                {presetServices.map(preset => (
                                                    <option key={preset.id} value={preset.id}>
                                                        {preset.name} — {formatMoney(preset.price)}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>

                                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                            <div class="sm:col-span-2">
                                                <label class="block text-xs font-medium text-slate-600 mb-1">ឈ្មោះសេវាកម្ម *</label>
                                                <input 
                                                    type="text" 
                                                    required
                                                    placeholder="ឈ្មោះសេវាកម្មព្យាបាល..."
                                                    value={newService.name}
                                                    onChange={(e) => setNewService({ ...newService, name: e.target.value })}
                                                    class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 bg-white"
                                                />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-medium text-slate-600 mb-1">តម្លៃ (USD) *</label>
                                                <input 
                                                    type="number" 
                                                    required
                                                    min="0"
                                                    placeholder="0.00"
                                                    value={newService.price}
                                                    onChange={(e) => setNewService({ ...newService, price: e.target.value })}
                                                    class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-teal-700 focus:ring-2 focus:ring-teal-500 bg-white"
                                                />
                                            </div>
                                        </div>

                                        <ToothSelector 
                                            label="ជ្រើសរើសលេខធ្មេញបន្ថែម (រំកិលឆ្វេងស្តាំ):"
                                            selectedTeeth={newService.teeth}
                                            onToggleTooth={handleToggleServiceTooth}
                                        />

                                        <div class="flex justify-end">
                                            <button 
                                                type="submit" 
                                                class="bg-teal-700 hover:bg-teal-800 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition flex items-center gap-1">
                                                <i data-lucide="plus" class="w-4 h-4"></i>
                                                + បន្ថែមសេវាកម្មនេះ
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            )}

                            {/* TAB 2: APPOINTMENTS */}
                            {activeTab === 'appointments' && (
                                <div class="space-y-6">
                                    <form onSubmit={submitAddAppointment} class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                                        <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
                                            <i data-lucide="calendar-plus" class="w-4 h-4 text-teal-600"></i>
                                            បន្ថែមការណាត់ជួបថ្មីសម្រាប់អ្នកជំងឺនេះ
                                        </h4>
                                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                            <div>
                                                <label class="block text-xs font-medium text-slate-600 mb-1">កាលបរិច្ឆេទ *</label>
                                                <input 
                                                    type="date" 
                                                    required
                                                    value={newApp.date}
                                                    onChange={(e) => setNewApp({ ...newApp, date: e.target.value })}
                                                    class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 bg-white"
                                                />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-medium text-slate-600 mb-1">ម៉ោងណាត់ជួប</label>
                                                <input 
                                                    type="time" 
                                                    value={newApp.time}
                                                    onChange={(e) => setNewApp({ ...newApp, time: e.target.value })}
                                                    class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 bg-white"
                                                />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-medium text-slate-600 mb-1">បរិយាយ</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="ឧទាហរណ៍: សារ៉េដែកពត់ធ្មេញ"
                                                    value={newApp.note}
                                                    onChange={(e) => setNewApp({ ...newApp, note: e.target.value })}
                                                    class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 bg-white"
                                                />
                                            </div>
                                        </div>
                                        <div class="flex justify-end pt-1">
                                            <button 
                                                type="submit" 
                                                class="bg-teal-700 hover:bg-teal-800 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition">
                                                + រក្សាទុកការណាត់ជួប
                                            </button>
                                        </div>
                                    </form>

                                    <div class="border border-slate-200 rounded-xl overflow-hidden">
                                        <table class="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr class="bg-slate-50 text-slate-500 font-semibold uppercase border-b border-slate-200">
                                                    <th class="py-2.5 px-4">ថ្ងៃណាត់ / ម៉ោង</th>
                                                    <th class="py-2.5 px-4">បរិយាយការណាត់ជួប</th>
                                                    <th class="py-2.5 px-4">ស្ថានភាព</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-100">
                                                {(!patient.appointments || patient.appointments.length === 0) ? (
                                                    <tr>
                                                        <td colSpan="3" class="py-6 text-center text-slate-400">គ្មានប្រវត្តិណាត់ជួបឡើយ</td>
                                                    </tr>
                                                ) : (
                                                    patient.appointments.map(app => (
                                                        <tr key={app.id} class="hover:bg-slate-50">
                                                            <td class="py-3 px-4 font-bold text-slate-800">
                                                                {formatDate(app.date)} ({app.time || '09:00'})
                                                            </td>
                                                            <td class="py-3 px-4 text-slate-700">{app.note || 'ការណាត់ជួបពិនិត្យ'}</td>
                                                            <td class="py-3 px-4">
                                                                <button 
                                                                    onClick={() => onToggleAppointmentStatus(patient.id, app.id)}
                                                                    class={`px-2.5 py-1 rounded-full text-[11px] font-bold ${app.status === 'រួចរាល់' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                                                    {app.status}
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* TAB 3: PAYMENTS HISTORY */}
                            {activeTab === 'payments' && (
                                <div class="space-y-6">
                                    <form onSubmit={submitAddPayment} class="bg-emerald-50/60 p-4 rounded-2xl border border-emerald-200 space-y-3">
                                        <h4 class="text-xs font-bold text-emerald-800 uppercase tracking-wider flex items-center gap-1.5">
                                            <i data-lucide="wallet" class="w-4 h-4"></i>
                                            បង់ប្រាក់បន្ថែម / កក់បន្ថែម
                                        </h4>
                                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                            <div>
                                                <label class="block text-xs font-medium text-slate-600 mb-1">ចំនួនប្រាក់ (USD) *</label>
                                                <input 
                                                    type="number" 
                                                    required
                                                    min="1"
                                                    placeholder="0.00"
                                                    value={newPay.amount}
                                                    onChange={(e) => setNewPay({ ...newPay, amount: e.target.value })}
                                                    class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-emerald-700 focus:ring-2 focus:ring-teal-500 bg-white"
                                                />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-medium text-slate-600 mb-1">ថ្ងៃបង់ប្រាក់</label>
                                                <input 
                                                    type="date" 
                                                    value={newPay.date}
                                                    onChange={(e) => setNewPay({ ...newPay, date: e.target.value })}
                                                    class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 bg-white"
                                                />
                                            </div>
                                            <div>
                                                <label class="block text-xs font-medium text-slate-600 mb-1">កំណត់សម្គាល់/វិធីសាស្ត្រ</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="សាច់ប្រាក់ / វេរធនាគារ..."
                                                    value={newPay.note}
                                                    onChange={(e) => setNewPay({ ...newPay, note: e.target.value })}
                                                    class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-teal-500 bg-white"
                                                />
                                            </div>
                                        </div>
                                        <div class="flex justify-end pt-1">
                                            <button 
                                                type="submit" 
                                                class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition">
                                                + រក្សាទុកការបង់ប្រាក់
                                            </button>
                                        </div>
                                    </form>

                                    <div class="border border-slate-200 rounded-xl overflow-hidden">
                                        <table class="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr class="bg-slate-50 text-slate-500 font-semibold uppercase border-b border-slate-200">
                                                    <th class="py-2.5 px-4">កាលបរិច្ឆេទ</th>
                                                    <th class="py-2.5 px-4">កំណត់សម្គាល់</th>
                                                    <th class="py-2.5 px-4 text-right">ចំនួនប្រាក់បង់ (USD)</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-100">
                                                {(!patient.payments || patient.payments.length === 0) ? (
                                                    <tr>
                                                        <td colSpan="3" class="py-6 text-center text-slate-400">មិនទាន់មានប្រវត្តិបង់ប្រាក់ឡើយ</td>
                                                    </tr>
                                                ) : (
                                                    patient.payments.map(p => (
                                                        <tr key={p.id} class="hover:bg-slate-50">
                                                            <td class="py-3 px-4 font-bold text-slate-800">{formatDate(p.date)}</td>
                                                            <td class="py-3 px-4 text-slate-600">{p.note || 'បង់ប្រាក់'}</td>
                                                            <td class="py-3 px-4 text-right font-extrabold text-emerald-600">{formatMoney(p.amount)}</td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                        </div>

                        {/* Modal Footer */}
                        <div class="p-4 border-t border-slate-200 bg-slate-50 flex justify-end">
                            <button 
                                onClick={onClose}
                                class="px-5 py-2 bg-slate-800 text-white hover:bg-slate-900 rounded-xl text-xs font-bold shadow">
                                រួចរាល់
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function PosReceiptModal({ patient, clinicInfo, onClose, getPatientTotals }) {
            const { totalCost, totalPaid, remaining } = getPatientTotals(patient);

            const handlePrint = () => {
                window.print();
            };

            return (
                <div class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden flex flex-col no-print my-auto">
                        <div class="bg-slate-800 px-5 py-3 text-white flex justify-between items-center">
                            <span class="text-xs font-bold flex items-center gap-1.5">
                                <i data-lucide="printer" class="w-4 h-4 text-amber-400"></i>
                                មើលគំរូវិក្កយបត្រ POS (80mm)
                            </span>
                            <button onClick={onClose} class="text-slate-400 hover:text-white">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>

                        {/* Thermal Print Preview Container */}
                        <div class="p-6 bg-slate-100 flex justify-center">
                            <div class="pos-printable-area bg-white p-4 shadow-md w-full max-w-[80mm] text-slate-900 text-[11px] leading-tight border border-slate-200 rounded">
                                {/* Header */}
                                <div class="text-center pb-2 border-b border-dashed border-slate-400">
                                    <h2 class="text-sm font-extrabold uppercase">{clinicInfo.name}</h2>
                                    <p class="text-[10px] text-slate-600 mt-0.5">{clinicInfo.address}</p>
                                    <p class="text-[10px] text-slate-600">ទូរស័ព្ទ: {clinicInfo.phone}</p>
                                    <p class="text-xs font-bold mt-2 uppercase underline">វិក្កយបត្រ / RECEIPT</p>
                                </div>

                                {/* Patient Info */}
                                <div class="py-2 border-b border-dashed border-slate-400 space-y-1 text-[10px]">
                                    <div class="flex justify-between">
                                        <span>លេខកូដ: <strong>{patient.id}</strong></span>
                                        <span>ថ្ងៃទី: <strong>{formatDate(getTodayIso())}</strong></span>
                                    </div>
                                    <div>អ្នកជំងឺ: <strong>{patient.name}</strong> ({patient.gender}, {patient.age} ឆ្នាំ)</div>
                                    <div>លេខទូរស័ព្ទ: <strong>{patient.phone}</strong></div>
                                </div>

                                {/* Itemized Services */}
                                <div class="py-2 border-b border-dashed border-slate-400">
                                    <table class="w-full text-left text-[10px]">
                                        <thead>
                                            <tr class="border-b border-slate-300 font-bold">
                                                <th class="pb-1">សេវាកម្ម/ធ្មេញ</th>
                                                <th class="pb-1 text-right">តម្លៃ</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-100">
                                            {patient.services && patient.services.map((s, idx) => (
                                                <tr key={s.id || idx}>
                                                    <td class="py-1">
                                                        <div class="font-bold">{s.name}</div>
                                                        {s.teeth && s.teeth.length > 0 && (
                                                            <div class="text-[9px] text-slate-600">
                                                                ធ្មេញ: #{s.teeth.join(', #')}
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td class="py-1 text-right font-bold align-top">
                                                        {formatMoney(s.price)}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                {/* Payment Breakdown */}
                                <div class="py-2 border-b border-dashed border-slate-400 space-y-1 text-[10px]">
                                    <div class="flex justify-between font-bold">
                                        <span>តម្លៃសេវាកម្មសរុប:</span>
                                        <span>{formatMoney(totalCost)}</span>
                                    </div>
                                    <div class="flex justify-between text-emerald-700 font-bold">
                                        <span>បានបង់/កក់សរុប:</span>
                                        <span>{formatMoney(totalPaid)}</span>
                                    </div>
                                    <div class="flex justify-between text-rose-600 font-extrabold text-xs pt-1 border-t border-slate-200">
                                        <span>នៅខ្វះ (REMAINING):</span>
                                        <span>{remaining > 0 ? formatMoney(remaining) : '$0.00'}</span>
                                    </div>
                                </div>

                                {/* Footer */}
                                <div class="text-center pt-3 text-[9px] text-slate-500 italic space-y-1">
                                    <p>{clinicInfo.footerNote}</p>
                                    <p class="font-bold text-[8px] tracking-wider text-slate-400 pt-1">*** POWERED BY DENTAL CLINIC POS ***</p>
                                </div>
                            </div>
                        </div>

                        {/* Action Buttons */}
                        <div class="p-4 bg-white border-t border-slate-200 flex justify-end gap-2">
                            <button 
                                onClick={onClose}
                                class="px-4 py-2 border border-slate-300 text-slate-700 rounded-xl text-xs font-medium">
                                បិទ
                            </button>
                            <button 
                                onClick={handlePrint}
                                class="px-5 py-2 bg-teal-700 hover:bg-teal-800 text-white font-bold rounded-xl text-xs shadow flex items-center gap-1.5">
                                <i data-lucide="printer" class="w-4 h-4"></i>
                                <span>បោះពុម្ពវិក្កយបត្រ</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        window.onload = function() {
            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        };
    </script>
</body>
</html>
