        const KHMER_MONTHS = ['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];

        const safeGetStorage = (key, fallback) => {
            try { const item = localStorage.getItem(key); return item ? JSON.parse(item) : fallback; }
            catch (e) { console.warn(e); return fallback; }
        };
        const safeSetStorage = (key, value) => {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.warn(e); }
        };
        const formatMoney = (amt) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amt || 0);
        const formatDate = (s) => {
            if (!s) return '';
            const d = new Date(s);
            if (isNaN(d.getTime())) return s;
            return d.toLocaleDateString('km-KH', { year: 'numeric', month: 'short', day: 'numeric' });
        };
        const getTodayIso = () => new Date().toISOString().split('T')[0];

        // Convert "តុលា 2026" -> "2026-10"
        const khmerMonthToIso = (str) => {
            if (!str) return '';
            const [mName, y] = str.split(' ');
            const idx = KHMER_MONTHS.indexOf(mName);
            if (idx < 0 || !y) return '';
            return `${y}-${String(idx + 1).padStart(2, '0')}`;
        };
        // Convert "2026-10" -> "តុលា 2026"
        const isoToKhmerMonth = (iso) => {
            if (!iso) return '';
            const [y, m] = iso.split('-');
            return `${KHMER_MONTHS[parseInt(m) - 1]} ${y}`;
        };

        /* ===================== ICONS ===================== */

        /* ===================== TOOTH SELECTOR ===================== */
        function ToothSelector({ selectedTeeth = [], onToggleTooth, label }) {
            const renderTooth = (t) => {
                const isSel = selectedTeeth.includes(t);
                return (
                    <button type="button" key={t} onClick={() => onToggleTooth(t)}
                        className={`w-7 h-7 rounded-lg text-xs font-bold transition flex items-center justify-center border cursor-pointer ${
                            isSel ? 'bg-teal-600 text-white border-teal-700 shadow-sm scale-105'
                                  : 'bg-white text-slate-700 border-slate-200 hover:border-teal-400 hover:bg-teal-50'}`}>
                        {t}
                    </button>
                );
            };
            return (
                <div className="space-y-1">
                    {label && <label className="block text-xs font-semibold text-slate-700 mb-1">{label}</label>}
                    <div className="bg-slate-100/90 p-3 rounded-2xl border border-slate-200 overflow-x-auto max-w-full">
                        <div className="min-w-max flex flex-col items-center gap-2">
                            <div className="flex items-center gap-1 flex-nowrap">

                                <div className="w-px h-6 bg-slate-300 mx-1.5"></div>
                                <div className="flex items-center gap-1">{UPPER_TEETH_LEFT.map(renderTooth)}</div>
                            </div>
                            <div className="w-full border-t border-slate-200 my-0.5"></div>
                            <div className="flex items-center gap-1 flex-nowrap">
                                <span className="text-[11px] font-bold text-teal-700 mr-1 w-10 text-right">ក្រោម:</span>
                                <div className="flex items-center gap-1">{LOWER_TEETH_RIGHT.map(renderTooth)}</div>
                                <div className="w-px h-6 bg-slate-300 mx-1.5"></div>
                                <div className="flex items-center gap-1">{LOWER_TEETH_LEFT.map(renderTooth)}</div>
                            </div>
                        </div>
                    </div>
                    <p className="text-[11px] text-teal-700 font-semibold pt-1">
                        ធ្មេញជ្រើសរើស: {selectedTeeth.length > 0 ? selectedTeeth.slice().sort((a,b)=>a-b).join(', ') : 'គ្មាន (ជ្រើសរើសទូទៅ)'}

        /* ===================== REPORTS VIEW (ផ្គុំពីកូដទី២) ===================== */
        function ReportsView({ patients, clinicInfo, onPrintReport }) {
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonthIndex = today.getMonth();
            const currentDayFormatted = today.toISOString().split('T')[0];
            const defaultMonthStr = `${KHMER_MONTHS[currentMonthIndex]} ${currentYear}`;

            const [reportType, setReportType] = useState('monthly'); // 'daily' | 'monthly'
            const [selectedDate, setSelectedDate] = useState(currentDayFormatted);
            const [selectedMonth, setSelectedMonth] = useState(defaultMonthStr);
            const [isPickerOpen, setIsPickerOpen] = useState(false);

            // Generate dynamic options (auto-updating for future years)
            const generateDynamicOptions = () => {
                if (reportType === 'monthly') {
                    const options = [];
                    for (let y = currentYear - 2; y <= currentYear + 10; y++) {
                        for (let m = 0; m < 12; m++) options.push(`${KHMER_MONTHS[m]} ${y}`);
                    }
                    return options;
                } else {
                    const options = [];
                    for (let i = 0; i < 60; i++) {
                        const d = new Date();
                        d.setDate(today.getDate() - i);
                        options.push(d.toISOString().split('T')[0]);
                    }
                    return options;
                }
            };
            const currentOptions = generateDynamicOptions();

            // Filter key: ISO date (daily) or ISO month (monthly)
            const filterKey = reportType === 'daily' ? selectedDate : khmerMonthToIso(selectedMonth);

            // Filter real data
            const inRange = (dateStr) => dateStr && dateStr.startsWith(filterKey);

            const periodPayments = patients.flatMap(p =>
                (p.payments || []).map(pm => ({ ...pm, patientName: p.name, patientPhone: p.phone, patientId: p.id }))
            ).filter(pm => inRange(pm.date));

            const newPatientsList = patients.filter(p => inRange(p.createdAt));

            const periodAppointments = patients.flatMap(p =>
                (p.appointments || []).map(ap => ({ ...ap, patientName: p.name, patientPhone: p.phone }))
            ).filter(ap => inRange(ap.date));

            const totalRevenue = periodPayments.reduce((s, pm) => s + pm.amount, 0);
            const completedAppointments = periodAppointments.filter(ap => ap.status === 'រួចរាល់');
            const newServicesBilled = newPatientsList.reduce((s, p) =>
                s + (p.services || []).reduce((ss, sv) => ss + sv.price, 0), 0);
            const avgRevenue = periodPayments.length > 0 ? totalRevenue / periodPayments.length : 0;

            const title = reportType === 'daily' ? 'របាយការណ៍បូកសរុបប្រចាំថ្ងៃ' : 'របាយការណ៍បូកសរុបប្រចាំខែ';
            const subtitle = reportType === 'daily'
                ? 'តាមការចំណូល ចំនួនអ្នកជំងឺ និងការណាត់ជួបប្រចាំថ្ងៃ'
                : 'តាមការចំណូល ចំនួនអ្នកជំងឺ និងការណាត់ជួបប្រចាំខែ';
            const periodLabel = reportType === 'daily' ? `កាលបរិច្ឆេទ: ${selectedDate}` : `ខែ: ${selectedMonth}`;

            const handlePrintPOS = () => {
                const printWindow = window.open('', '_blank', 'width=350,height=600');
                if (!printWindow) return;
                printWindow.document.write(`
                    <html><head><title>POS - ${title}</title>
                    <style>
                        body { font-family: 'Courier New', monospace; width: 300px; margin: 0 auto; padding: 10px; color: #000; background: #fff; }
                        .center { text-align: center; } .bold { font-weight: bold; }
                        .line { border-bottom: 1px dashed #000; margin: 8px 0; }
                        .flex { display: flex; justify-content: space-between; }
                        .small { font-size: 11px; } .title { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
                    </style></head><body>
                        <div class="center title">${clinicInfo.name}</div>
                        <div class="center small">${clinicInfo.subtitle}</div>
                        <div class="line"></div>
                        <div class="center bold">${title}</div>
                        <div class="center small">${periodLabel}</div>
                        <div class="line"></div>
                        <div class="flex"><span>ប្រាក់ចំណូលសរុប:</span><span class="bold">${formatMoney(totalRevenue)}</span></div>
                        <div class="small" style="margin-bottom:6px;">ប្រតិបត្តិការបង់ប្រាក់: ${periodPayments.length} លើក</div>

                                    <p style={{ fontSize: '10px' }}>ទូរស័ព្ទ: {clinicInfo.phone}</p>
                                    <div style={{ borderBottom: '1px dashed #000', margin: '4px 0' }}></div>
                                    <h3 style={{ fontSize: '11px', fontWeight: 'bold' }}>វិក្កយបត្រ / RECEIPT</h3>
                                </div>
                                <div style={{ fontSize: '10px', marginBottom: '8px' }}>
                                    <p>អ្នកជំងឺ: <strong>{posPatientModal.name}</strong></p>
                                    <p>ទូរស័ព្ទ: {posPatientModal.phone}</p>
                                    <p>កាលបរិច្ឆេទ: {getTodayIso()}</p>
                                </div>
                                <div style={{ borderTop: '1px dashed #000', borderBottom: '1px dashed #000', padding: '4px 0', marginBottom: '8px' }}>
                                    {posPatientModal.services.map((s, i) => (
                                        <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: '10px', marginBottom: '3px' }}>
                                            <span>{s.name} ({s.teeth.join(',') || 'ទូទៅ'})</span>
                                            <span style={{ fontWeight: 'bold' }}>${s.price}</span>
                                        </div>
                                    ))}
                                </div>
                                {(() => {
                                    const tot = posPatientModal.services.reduce((a,b)=>a+b.price, 0);
                                    const paid = posPatientModal.payments.reduce((a,b)=>a+b.amount, 0);
                                    const bal = tot - paid;
                                    return (
                                        <div style={{ fontSize: '10px', lineHeight: '1.4' }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>សរុប:</span><strong>${tot}</strong></div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between' }}><span>បានបង់:</span><strong>${paid}</strong></div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', borderTop: '1px solid #000', paddingTop: '2px' }}><span>នៅខ្វះ:</span><strong>${bal}</strong></div>
                                        </div>
                                    );
                                })()}
                                <div style={{ textAlign: 'center', marginTop: '12px', fontSize: '9px' }}>
                                    <p>{clinicInfo.footerNote}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Floating Sparkle (from Code 2) */}
                    <div className="fixed bottom-6 right-6 z-40 no-print">
                        <button onClick={() => setCurrentView("reports")}
                            className="w-12 h-12 bg-slate-900 rounded-full flex items-center justify-center text-white shadow-lg cursor-pointer hover:scale-105 transition"
                            title="ទៅកាន់របាយការណ៍">
                            <span className="text-yellow-400 animate-pulse"><Icons.Sparkles /></span>
                        </button>
                    </div>
                </div>
            );
        }

        /* ===================== ERROR BOUNDARY ===================== */
        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, info) { console.error("React Error:", error, info); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-6 max-w-lg mx-auto my-10 bg-red-50 border border-red-200 rounded-2xl text-red-800 text-xs space-y-2">
                            <h3 className="font-bold text-sm">មានបញ្ហាក្នុងការដំណើរការកម្មវិធី</h3>
                            <p>{this.state.error?.toString()}</p>
                            <button onClick={() => { localStorage.clear(); window.location.reload(); }}
                                className="mt-2 px-3 py-1 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 cursor-pointer">
                                រៀបចំឡើងវិញ (Reset Storage)
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
